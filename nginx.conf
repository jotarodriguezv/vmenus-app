server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # ── CACHÉ ────────────────────────────────────────────────────
  # Los archivos de esta aplicación no llevan versión en el nombre:
  # core/carrito.js se llama igual antes y después de un despliegue. Con una
  # caché por tiempo (antes: expires 1h) el navegador seguía usando el de
  # antes hasta que caducara, y durante esa ventana ejecutaba código viejo.
  #
  # No es teórico: al migrar los toppings de una copia por plato al catálogo
  # del negocio, los navegadores con el JS anterior estuvieron una hora
  # leyendo unos campos que ya no existían. Ningún plato abría su modal de
  # personalización y no había forma de saberlo desde el servidor.
  #
  # 'no-cache' no significa "no guardes": significa "guarda, pero pregunta
  # antes de usarlo". El navegador manda una petición condicional con el
  # ETag y nginx responde 304 sin cuerpo si el archivo no cambió — se ahorra
  # la descarga igual, y nunca se sirve una versión vieja.
  #
  # El día que los archivos lleven un hash en el nombre esto puede volver a
  # ser 'expires 1y; immutable', pero entonces por el motivo correcto: porque
  # un nombre nuevo es un archivo nuevo.
  #
  # Ojo con add_header: en nginx, ponerlo dentro de un location ANULA los del
  # bloque padre. Por eso se repite en cada uno en vez de declararlo arriba.

  # ── VISTA PREVIA AL COMPARTIR ────────────────────────────────
  # El robot de WhatsApp pide la URL, lee el HTML crudo y se va: no ejecuta
  # JavaScript. Como esta carta se pinta en el navegador, el index.html que
  # sale de aquí no sabe de qué restaurante es, y compartir un enlace mandaba
  # una tarjeta vacía. No se arregla desde el cliente: cuando ese código
  # corre, la vista previa ya se decidió.
  #
  # Así que a los robots —y SOLO a ellos— se les manda a un endpoint del panel
  # que sí lee la base y devuelve las etiquetas ya puestas. Las personas no
  # pasan por aquí: si el panel se cayera, se pierden las miniaturas de las
  # cosas que se compartan ese rato, no las cartas.
  #
  # Mirar el User-Agent es frágil por definición —un robot nuevo no está en la
  # lista y se queda sin tarjeta— pero el fallo cae del lado bueno: sin
  # miniatura, nunca sin carta.
  #
  # El $host va en la URL porque la misma carta responde de dos formas,
  # menu.vmenus.co/bonzas y bonzas.vmenus.co, y el panel no puede adivinar
  # con cuál entraron. Aquí sí se sabe.
  set $robot 0;
  if ($http_user_agent ~* "(facebookexternalhit|WhatsApp|Twitterbot|Slackbot|LinkedInBot|TelegramBot|Discordbot|Applebot|SkypeUriPreview|redditbot|Pinterest|vkShare|W3C_Validator|Googlebot|bingbot)") {
    set $robot 1;
  }

  # ── CARTELERA DIGITAL ────────────────────────────────────────
  # /bonzas/tv  y  bonzas.vmenus.co/tv  sirven tv.html, no el menú.
  #
  # Va ANTES de 'location /' porque ahí el try_files acaba cayendo en
  # index.html para cualquier ruta que no sea un archivo — que es justo lo que
  # hace que las cartas funcionen por slug, y lo que se llevaría también esta.
  #
  # En nginx las expresiones regulares ganan a los prefijos y se prueban en el
  # orden en que están escritas, así que este bloque tiene que quedar el
  # primero de los regulares.
  #
  # El grupo opcional cubre las dos formas de URL que conviven: con el slug en
  # la ruta y con el slug en el subdominio.
  location ~ ^/([^/]+/)?tv/?$ {
    try_files /tv.html =404;
    # Sin versión en el nombre, igual que el resto: se revalida siempre para
    # que un despliegue llegue al televisor en su siguiente recarga.
    add_header Cache-Control "no-cache";
  }

  location / {
    # El resolver hace falta de verdad, aunque el nombre del panel esté
    # escrito entero aquí abajo: en cuanto proxy_pass lleva UNA variable
    # —y lleva $host y $uri— nginx trata la URL como dinámica y se niega a
    # arrancar la petición sin resolver. Sin esta línea, "no resolver defined
    # to resolve adminvmenus.verificame.click" y 502.
    # El 127.0.0.11 es el DNS interno de Docker; 1.1.1.1 es la red de seguridad.
    resolver 127.0.0.11 1.1.1.1 valid=30s ipv6=off;

    # ── EL SNI NO ES OPCIONAL ────────────────────────────────
    # nginx, al hablar HTTPS con otro servidor, NO manda el nombre del
    # destino en el handshake si no se le dice. Y el panel está detrás de
    # Traefik, que enruta precisamente por ese nombre: sin él no sabe ni qué
    # certificado servir ni a qué aplicación mandar la petición, así que
    # corta la conexión. nginx devuelve 502 y el robot se queda sin tarjeta.
    #
    # Costó encontrarlo porque no falla de forma visible: las cartas siguen
    # funcionando y lo único que pasa es que las vistas previas nunca
    # aparecen, que es indistinguible de "WhatsApp no las hace".
    #
    # Comprobado con un panel de mentira que apunta qué SNI recibe: sin esta
    # línea llega vacío, con ella llega adminvmenus.verificame.click.
    proxy_ssl_server_name on;

    # Un panel lento no puede dejar colgado al robot. Si no contesta en unos
    # segundos, mejor sin tarjeta que con la conexión abierta.
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;

    if ($robot) {
      proxy_pass https://adminvmenus.verificame.click/api/og?host=$host&path=$uri;
    }

    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Este bloque gana sobre location / para los .js y .css. No lleva
  # try_files a propósito: un módulo que no existe debe dar 404 y no la
  # página entera disfrazada de JavaScript, que produce un error de sintaxis
  # imposible de leer en la consola.
  location ~* \.(js|css)$ {
    add_header Cache-Control "no-cache";
  }
}
