server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # ── CACHÉ ────────────────────────────────────────────────────
  # Los archivos de esta aplicación no llevan versión en el nombre:
  # core/carrito.js se llama igual antes y después de un despliegue. Con una
  # caché por tiempo (antes: expires 1h) el navegador seguía usando el de
  # antes hasta que caducara, y durante esa ventana ejecutaba código viejo.
  #
  # No es teórico: al migrar los toppings de una copia por plato al catálogo
  # del negocio, los navegadores con el JS anterior estuvieron una hora
  # leyendo unos campos que ya no existían. Ningún plato abría su modal de
  # personalización y no había forma de saberlo desde el servidor.
  #
  # 'no-cache' no significa "no guardes": significa "guarda, pero pregunta
  # antes de usarlo". El navegador manda una petición condicional con el
  # ETag y nginx responde 304 sin cuerpo si el archivo no cambió — se ahorra
  # la descarga igual, y nunca se sirve una versión vieja.
  #
  # El día que los archivos lleven un hash en el nombre esto puede volver a
  # ser 'expires 1y; immutable', pero entonces por el motivo correcto: porque
  # un nombre nuevo es un archivo nuevo.
  #
  # Ojo con add_header: en nginx, ponerlo dentro de un location ANULA los del
  # bloque padre. Por eso se repite en cada uno en vez de declararlo arriba.

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Este bloque gana sobre location / para los .js y .css. No lleva
  # try_files a propósito: un módulo que no existe debe dar 404 y no la
  # página entera disfrazada de JavaScript, que produce un error de sintaxis
  # imposible de leer en la consola.
  location ~* \.(js|css)$ {
    add_header Cache-Control "no-cache";
  }
}
