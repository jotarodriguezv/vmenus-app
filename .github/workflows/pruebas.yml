# Corre las pruebas en cada push y en cada pull request.
#
# Se incluye 'push' y no solo 'pull_request' a propósito: los archivos de este
# repositorio se suben a veces directamente a main desde la web de GitHub, y
# esos cambios no pasan por ningún pull request. Sin esto, justo los que menos
# revisión tienen serían los únicos sin comprobar.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 22 por su ejecutor de pruebas incorporado. Este repositorio es un
      # sitio estático servido por nginx: no hay dependencias que instalar, así
      # que no hace falta ningún 'npm install'.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar pruebas
        run: npm test
