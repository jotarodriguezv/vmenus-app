<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carta</title>
<style>
	/* ── CARTELERA DIGITAL ─────────────────────────────────────
	   CSS conservador a propósito: flexbox (2013) y nada de grid,
	   aspect-ratio ni color-mix. El porqué, en el comentario del guion. */
	* { box-sizing: border-box; margin: 0; padding: 0; }
	html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
	body { font-family: Helvetica, Arial, sans-serif; color: #fff; }

	/* El marco existe para poder girarlo entero en modo vertical. */
	#marco { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
	         transform-origin: top left; }

	/* Modo vertical: el televisor está girado físicamente, pero el navegador
	   sigue reportando el viewport apaisado — la rotación es del soporte, no
	   del sistema. Así que se gira el contenido y se intercambian medidas.
	   El orden importa: 'rotate' se aplica primero y 'translateX' después,
	   en el espacio sin girar, que es lo que lo devuelve a la pantalla. */
	body.vertical #marco { width: 100vh; height: 100vw;
	                       transform: translateX(100vw) rotate(90deg); }

	#slides { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
	.slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
	         display: flex; align-items: center; justify-content: center;
	         opacity: 0; transition: opacity 900ms ease-in-out; padding: 3vmin; }
	.slide.visible { opacity: 1; }

	/* Los platos del slide. En vertical se apilan. */
	.fila { display: flex; width: 100%; height: 100%; }
	body.vertical .fila { flex-direction: column; }

	.plato { flex: 1 1 0; display: flex; flex-direction: column;
	         margin: 1.2vmin; min-width: 0; min-height: 0; }
	/* La foto va dentro de un marco que recorta, para que pueda crecer despacio
	   sin salirse ni empujar al vecino. */
	.marco-foto { flex: 1 1 auto; width: 100%; min-height: 0; overflow: hidden;
	              border-radius: 1.4vmin; background: #16151f; }
	.foto { width: 100%; height: 100%;
	        background: center center no-repeat; background-size: cover; }
	/* El nombre de la categoría, encima de la foto. Sutil a propósito: está para
	   quien no sepa qué es "Pepito", no para competir con el plato. Lleva fondo
	   propio porque va sobre la foto, igual que la marca del negocio. */
	.marco-foto { position: relative; }
	.categoria { position: absolute; top: 0.9vmin; left: 0.9vmin; z-index: 2;
	             padding: 0.34em 0.72em; border-radius: 0.45em;
	             background: rgba(10, 10, 15, 0.62); color: #e8e8ee;
	             font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
	             max-width: 82%; overflow: hidden; white-space: nowrap;
	             text-overflow: ellipsis; }
	/* El relleno va en 'em' y no en vmin a propósito: así crece con la letra.
	   Con vmin fijo, al agrandar el texto la caja quedaba estrecha y apretada. */

	/* La etiqueta se va a la esquina contraria de la marca del negocio. La
	   marca se dibuja POR ENCIMA de la primera foto, así que con el logo a la
	   izquierda las dos se peleaban por el mismo rincón y el nombre de la
	   categoría quedaba debajo. Como la marca cambia de lado en cada pantalla,
	   las etiquetas la acompañan; van todas a la vez para que se lea como un
	   espejo y no como una etiqueta descolocada. */
	.categoria.derecha { left: auto; right: 0.9vmin; }

	/* Las reglas de tipografía se escriben desde el guion, cuando ya se sabe
	   qué fuente eligió el restaurante. Va en su propia etiqueta y no en el
	   bloque de arriba porque este archivo no usa variables CSS —son de la
	   misma cosecha que las cosas que el guion tiene prohibidas— y sin ellas
	   la única forma de cambiar una regla es reescribirla. */

	.texto { flex: 0 0 auto; padding: 1.6vmin 0.4vmin 0; text-align: center; }
	.nombre { font-weight: 700; line-height: 1.15; letter-spacing: 0.02em;
	          overflow: hidden; }
	.precio { margin-top: 0.6vmin; font-weight: 700; color: #ffd521; }

	/* ── ANIMACIÓN ─────────────────────────────────────────────
	   Solo 'transform' y 'opacity': son las dos que el navegador puede pasarle
	   a la GPU. Cualquier otra —blur, box-shadow, width— obliga a repintar en
	   cada fotograma, y en el navegador de un televisor barato eso se ve a
	   tirones. La animación es para que la carta respire, no para lucirse.

	   Solo cuando el slide está visible: si no, los platos que ya salieron
	   seguirían animándose fuera de la vista gastando batería y GPU. */
	@keyframes acercar { from { transform: scale(1); } to { transform: scale(1.07); } }
	@keyframes subir   { from { opacity: 0; transform: translateY(1.6vmin); }
	                     to   { opacity: 1; transform: translateY(0); } }

	body.animada .slide.visible .foto {
		animation: acercar linear both;
		animation-duration: inherit;
	}
	body.animada .slide.visible .texto {
		animation: subir 700ms ease-out both;
	}
	/* El precio entra un pelín después que el nombre. Es lo que hace que se
	   lea en ese orden en vez de todo de golpe. */
	body.animada .slide.visible .precio {
		animation: subir 700ms ease-out both;
		animation-delay: 160ms;
	}
	body.animada .slide.visible .promo { animation: subir 700ms ease-out both; }

	/* La promoción ocupa el slide entero: esas piezas se diseñan para verse
	   solas y en una rejilla pequeña pierden todo el sentido. */
	.promo { width: 100%; height: 100%; display: flex; flex-direction: column; }
	.promo-foto { flex: 1 1 auto; min-height: 0; width: 100%;
	              background: center center no-repeat; background-size: contain; }
	/* El nombre y el precio salen SOLO si el restaurante los puso. Muchas piezas
	   ya llevan el texto dibujado dentro, y repetirlo debajo se ve mal. */
	.promo-texto { flex: 0 0 auto; text-align: center; padding: 1.8vmin 3vmin 0; }
	.promo-nombre { font-weight: 700; line-height: 1.15; letter-spacing: 0.02em; }
	.promo-precio { margin-top: 0.7vmin; font-weight: 700; }

	/* ── PANTALLA DE MARCA ─────────────────────────────────────────
	   El logo, una frase, o los dos. Se parece al reposo a propósito: es la
	   misma idea —la marca sola, centrada— y ya estaba resuelta ahí para
	   pantallas de cualquier tamaño. */
	.marca { width: 100%; height: 100%; display: flex; flex-direction: column;
	         align-items: center; justify-content: center; text-align: center;
	         padding: 6vmin; }
	.marca-logo { max-width: 38vmin; max-height: 38vmin; }
	/* El margen solo cuando hay las dos cosas: con el logo solo, centrado de
	   verdad se ve mejor que centrado y empujado hacia arriba. */
	.marca-logo.con-frase { margin-bottom: 4vmin; }
	.marca-frase { font-weight: 700; line-height: 1.25; letter-spacing: 0.02em;
	               max-width: 80%; }

	/* Riden el MISMO interruptor que el resto de las animaciones. Un logo con
	   movimiento propio, ajeno a esa casilla, devolvería justo el tirón que el
	   panel promete evitar al apagarla para el duplicado por WiFi. */
	body.animada .slide.visible .marca-logo  { animation: entrarLogo 900ms ease-out both; }
	body.animada .slide.visible .marca-frase { animation: subir 700ms ease-out both; animation-delay: 200ms; }
	@keyframes entrarLogo {
		from { opacity: 0; transform: scale(0.88); }
		to   { opacity: 1; transform: scale(1); }
	}

	/* Cuando no hay nada que enseñar. Nunca una pantalla en blanco. */
	#reposo { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
	          display: none; flex-direction: column; align-items: center;
	          justify-content: center; text-align: center; }
	#reposo.visible { display: flex; }
	#reposoLogo { max-width: 34vmin; max-height: 34vmin; margin-bottom: 3vmin; }
	#reposoNombre { font-size: 5vmin; font-weight: 700; letter-spacing: 0.08em; }

	/* Marca de agua discreta del negocio, arriba. Cambia de esquina en cada
	   slide para no quemar el panel: un OLED marca lo que no se mueve.
	   Lleva fondo propio porque va POR ENCIMA de las fotos: sin él, un logo
	   claro sobre un plato claro no se lee, y con las fotos de verdad —no las
	   de la prueba— eso pasa la mitad de las veces. */
	#marca { position: absolute; top: 2.4vmin; left: 2.4vmin; height: 6vmin;
	         padding: 0.9vmin 1.3vmin; border-radius: 1vmin;
	         background: rgba(10, 10, 15, 0.62);
	         opacity: 0.95; transition: all 900ms ease-in-out; }
	#marca.derecha { left: auto; right: 2.4vmin; }

	/* Aviso de que se está sirviendo lo último conocido, sin conexión. */
	#sinRed { position: absolute; bottom: 2vmin; right: 2vmin; display: none;
	          font-size: 1.8vmin; opacity: 0.45; }
	#sinRed.visible { display: block; }
</style>
<!-- Lo rellena aplicarFuentes() cuando ya se sabe qué eligió el restaurante.
     Vacía no pinta nada, así que si nunca llega la configuracion la cartelera
     se queda con la tipografia del bloque de arriba. -->
<style id="fuenteTitulos"></style>
</head>
<body>
	<div id="marco">
		<div id="slides"></div>
		<div id="reposo"><img id="reposoLogo" alt=""><div id="reposoNombre"></div></div>
		<img id="marca" alt="">
		<div id="sinRed">sin conexión</div>
	</div>

<script>
/* ── CARTELERA DIGITAL PARA TELEVISORES ─────────────────────────────────
 *
 * ESTE ARCHIVO NO COMPARTE NADA CON core/ NI CON temas/, Y ES A PROPÓSITO.
 *
 * Todo el código del menú usa módulos ES y encadenamiento opcional, que
 * aparece 104 veces y es sintaxis de 2020. Un televisor de 2018 con
 * Tizen 4 o webOS 4 no la degrada: lanza un error de sintaxis al leer el
 * archivo y no ejecuta nada. La pantalla se queda negra.
 *
 * Y ahí está la diferencia con el resto del sistema: un fallo en el menú lo
 * ve una persona que recarga; este lo ve la sala entera de un restaurante
 * durante todo un servicio, y quien podría arreglarlo está a cientos de
 * kilómetros sin poder abrir una consola.
 *
 * Por eso aquí se escribe ES5: var y function, XMLHttpRequest, concatenación
 * en vez de plantillas, y el DOM construido con createElement + textContent.
 * Eso último no es solo compatibilidad: al no construir HTML a partir de
 * datos, no hay nada que escapar y el problema de inyección no existe.
 *
 * Duplicar código nos ha costado dos incidentes en este repositorio, así que
 * lo poco que se repite —la URL de Supabase y su clave pública— va marcado
 * abajo con de dónde sale.
 *
 * AL EDITAR: test/tv.test.js escanea este archivo EN CRUDO, comentarios
 * incluidos. No es descuido — la primera versión despojaba comentarios y
 * cadenas antes de mirar, y una expresión regular con dos barras seguidas
 * disparaba el borrador de comentarios de línea y se llevaba por delante el
 * 94 % del código: la prueba pasaba por vacía, no por correcta. Un guardián
 * que no puede fallar vale más que uno que sabe de sintaxis. El precio es que
 * los comentarios tampoco pueden citar la sintaxis prohibida.
 * ------------------------------------------------------------------ */

(function () {
'use strict';

/* Espejo de core/supabase.js. Si cambian allí, cambian aquí. */
var SUPABASE_URL = 'https://tllpmdhkdlqoqpnqmuwn.supabase.co';
var SUPABASE_KEY = 'sb_publishable_PqQsGWYjDAu8oq9ABB1hnQ_658qW8RB';

/* Espejo de SUBDOMINIOS_RESERVADOS en core/loader.js. */
var SUBDOMINIOS_RESERVADOS = ['menu', 'www', 'admin', 'app', 'api'];

var SONDEO_MS   = 5 * 60 * 1000;   /* cada cuánto se pregunta por cambios */
var REINICIO_MS = 18 * 60 * 60 * 1000; /* red de seguridad, ver abajo */
var CLAVE_CACHE = 'vmenus_tv_';

var POR_DEFECTO = {
	activa: true, orientacion: 'horizontal', por_slide: 2,
	segundos: 8, modo: 'todos', categoria_id: null, productos: [], aleatorio: false,
	animacion: 'suave', mostrar_categoria: false, color_categoria: 'oscuro',
	tema: 'oscuro'
};

var arranque = new Date().getTime();
var slug = leerSlug();
var datos = null;      /* { restaurante, categorias, productos } */
var slides = [];       /* lista de listas de platos, o {promo:…} o {marca:…} */
var turnoIntercalado = 0;  /* por dónde va la rotación; avanza una vez por vuelta */
var indice = -1;
var temporizador = null;
var nodoActual = null;
var marcaDerecha = false;

/* ── UTILIDADES ──────────────────────────────────────────────────── */

function leerSlug() {
	var host = window.location.hostname;
	var partes = host.split('.');
	var trozos = window.location.pathname.split('/');
	var limpios = [];
	for (var i = 0; i < trozos.length; i++) if (trozos[i]) limpios.push(trozos[i]);
	/* La ruta puede ser /bonzas/tv o solo /tv si el slug va en el subdominio. */
	var porRuta = (limpios.length && limpios[0] !== 'tv') ? limpios[0] : '';
	if (/^\d+\.\d+\.\d+\.\d+$/.test(host) || partes.length < 3) return porRuta;
	var esReservado = false;
	for (var j = 0; j < SUBDOMINIOS_RESERVADOS.length; j++)
		if (SUBDOMINIOS_RESERVADOS[j] === partes[0]) esReservado = true;
	return esReservado ? porRuta : partes[0];
}

/* Solo http(s). No es que un javascript: corra dentro de un background-image,
   pero una URL rara ahí deja al navegador pidiendo algo que no existe. */
function urlSegura(u) {
	var s = String(u == null ? '' : u);
	return /^https?:\/\//i.test(s) ? s : '';
}

/* Guarda por qué falló la última petición, para que el aviso de la esquina no
   mienta. Un 400 no es un problema de red, y decir 'sin conexión' cuando el
   servidor contestó perfectamente manda a buscar el fallo al sitio equivocado
   — pasó en el primer despliegue y costó un rato. */
var ultimoFallo = '';

function pedir(recurso, alTerminar) {
	var x = new XMLHttpRequest();
	x.open('GET', SUPABASE_URL + '/rest/v1/' + recurso, true);
	x.setRequestHeader('apikey', SUPABASE_KEY);
	x.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
	x.timeout = 20000;
	x.onreadystatechange = function () {
		if (x.readyState !== 4) return;
		if (x.status < 200 || x.status >= 300) {
			/* status 0 es de verdad no llegar: sin red, DNS, CORS. Cualquier
			   otro número es el servidor diciendo que no. */
			ultimoFallo = x.status ? ('error ' + x.status) : 'sin conexión';
			registrar(x.status
				? ('Supabase respondió ' + x.status + ' a ' + recurso + ': ' + x.responseText)
				: ('no se pudo alcanzar Supabase para ' + recurso));
			alTerminar(null);
			return;
		}
		var v = null;
		try { v = JSON.parse(x.responseText); } catch (e) { v = null; }
		if (v === null) { ultimoFallo = 'respuesta ilegible'; registrar('JSON ilegible en ' + recurso); }
		alTerminar(v);
	};
	x.onerror = function () {
		ultimoFallo = 'sin conexión';
		registrar('fallo de red en ' + recurso);
		alTerminar(null);
	};
	x.ontimeout = function () {
		ultimoFallo = 'sin respuesta';
		registrar('se agotó la espera en ' + recurso);
		alTerminar(null);
	};
	x.send();
}

/* A la consola del navegador. En un televisor no se puede abrir, pero en el
   computador o el móvil desde el que se prueba el enlace por primera vez sí,
   y es justo entonces cuando hace falta. */
function registrar(texto) {
	if (window.console && console.warn) console.warn('[carta TV] ' + texto);
}

/* Si el restaurante no tiene 'tv' en sus atributos, la cartelera no existe
   para él: la página queda en reposo con su logo. Es lo que hace la
   funcionalidad de pago — quien no la tiene contratada no puede guardar esa
   clave, porque el servidor la filtra por plan, y sin la clave no hay pantalla.
   El defecto es NO activa a propósito: si fuera al revés, /{slug}/tv
   funcionaría gratis para todos los restaurantes de la plataforma. */
function tvActiva() {
	var a = (datos && datos.restaurante && datos.restaurante.atributos) || {};
	return !!(a.tv && a.tv.activa !== false);
}

function config() {
	var a = (datos && datos.restaurante && datos.restaurante.atributos) || {};
	var t = a.tv || {};
	var c = {};
	for (var k in POR_DEFECTO) if (POR_DEFECTO.hasOwnProperty(k)) {
		c[k] = (t[k] === undefined || t[k] === null) ? POR_DEFECTO[k] : t[k];
	}
	/* Rangos. Con 1 segundo la pantalla parpadea y marea; con una hora parece
	   congelada. Y un 'por_slide' de 9 deja los platos del tamaño de un sello. */
	c.segundos = Math.min(60, Math.max(4, parseInt(c.segundos, 10) || 8));
	c.por_slide = Math.min(4, Math.max(1, parseInt(c.por_slide, 10) || 1));
	if (c.orientacion !== 'vertical') c.orientacion = 'horizontal';
	/* Cualquier cosa que no sea 'ninguna' anima. Ante un valor raro es mejor
	   quedarse con lo bonito que dejar la pantalla quieta sin motivo. */
	if (c.animacion !== 'ninguna') c.animacion = 'suave';
	/* Tres opciones y nada más. Un valor raro se queda en el oscuro, que es el
	   que se lee sobre cualquier foto. */
	if (c.color_categoria !== 'claro' && c.color_categoria !== 'marca') {
		c.color_categoria = 'oscuro';
	}
	if (c.tema !== 'carta') c.tema = 'oscuro';
	return c;
}

/* ── QUÉ PLATOS ENTRAN ───────────────────────────────────────────── */

/* Espejo reducido de core/horarios.js: una categoría puede mostrarse solo
   dentro de una franja, y la hora es la del RESTAURANTE, no la del televisor.
   Ante cualquier configuración incompleta se muestra: es preferible enseñar
   de más que dejar la pantalla vacía por un dato mal escrito. */
function categoriaVisible(cat) {
	var h = cat && cat.atributos && cat.atributos.horario;
	if (!h || !h.activo) return true;
	var desde = aMinutos(h.desde), hasta = aMinutos(h.hasta);
	if (desde === null || hasta === null || desde === hasta) return true;

	var zona = (datos.restaurante.atributos && datos.restaurante.atributos.zona_horaria) || 'America/Bogota';
	var ahora = ahoraEn(zona);
	if (ahora === null) return true;

	var dias = (h.dias && h.dias.length) ? h.dias : [0,1,2,3,4,5,6];
	function tieneDia(d) { for (var i=0;i<dias.length;i++) if (dias[i] === d) return true; return false; }

	if (desde < hasta) return tieneDia(ahora.dia) && ahora.minutos >= desde && ahora.minutos < hasta;
	/* Franja que cruza la medianoche: la madrugada es la noche de ayer. */
	if (ahora.minutos >= desde) return tieneDia(ahora.dia);
	if (ahora.minutos < hasta)  return tieneDia((ahora.dia + 6) % 7);
	return false;
}

function aMinutos(hhmm) {
	var m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm == null ? '' : hhmm));
	if (!m) return null;
	var h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
	if (h > 23 || mi > 59) return null;
	return h * 60 + mi;
}

var DIAS = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };

function ahoraEn(zona) {
	/* Intl.DateTimeFormat con timeZone existe desde 2015, pero en un televisor
	   viejo puede faltar o no traer la base de husos. Si no está, se devuelve
	   null y el horario se ignora — que es el lado seguro. */
	if (!window.Intl || !Intl.DateTimeFormat) return null;
	try {
		var f = new Intl.DateTimeFormat('en-US', {
			timeZone: zona, weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false
		});
		var p = f.formatToParts ? f.formatToParts(new Date()) : null;
		if (!p) return null;
		var v = {};
		for (var i = 0; i < p.length; i++) v[p[i].type] = p[i].value;
		var hora = parseInt(v.hour, 10) % 24;
		if (DIAS[v.weekday] === undefined || isNaN(hora)) return null;
		return { dia: DIAS[v.weekday], minutos: hora * 60 + parseInt(v.minute, 10) };
	} catch (e) { return null; }
}

/* El nombre de la categoría de un plato. Se busca cada vez y no se cachea: son
   cuatro categorías y una lista de veinte, y un mapa que hay que invalidar en
   cada sondeo cuesta más de lo que ahorra. */
function nombreCategoria(id) {
	for (var i = 0; i < datos.categorias.length; i++) {
		if (datos.categorias[i].id === id) return datos.categorias[i].nombre || '';
	}
	return '';
}

function platosElegidos() {
	var c = config();
	var visibles = {};
	for (var i = 0; i < datos.categorias.length; i++) {
		if (categoriaVisible(datos.categorias[i])) visibles[datos.categorias[i].id] = true;
	}

	var salida = [];
	for (var j = 0; j < datos.productos.length; j++) {
		var p = datos.productos[j];
		if (!p.disponible) continue;
		/* Sin foto no hay slide: esto es un medio visual y un hueco gris se ve
		   peor que un plato de menos. */
		if (!urlSegura(p.imagen_url)) continue;
		if (!visibles[p.categoria_id]) continue;
		if (c.modo === 'categoria') {
			if (!c.categoria_id || p.categoria_id !== c.categoria_id) continue;
		} else if (c.modo === 'manual') {
			var dentro = false;
			for (var k = 0; k < c.productos.length; k++) if (c.productos[k] === p.id) dentro = true;
			if (!dentro) continue;
		}
		salida.push(p);
	}
	return salida;
}

/* Baraja y, si el primero del ciclo nuevo es el último del anterior, lo cambia
   de sitio. Sin eso, el punto de vuelta es justo donde se nota la repetición. */
function barajar(lista, ultimoPrevio) {
	var a = lista.slice(0);
	for (var i = a.length - 1; i > 0; i--) {
		var j = Math.floor(Math.random() * (i + 1));
		var t = a[i]; a[i] = a[j]; a[j] = t;
	}
	if (a.length > 1 && ultimoPrevio && a[0].id === ultimoPrevio.id) {
		var otro = 1 + Math.floor(Math.random() * (a.length - 1));
		var s = a[0]; a[0] = a[otro]; a[otro] = s;
	}
	return a;
}

function construirSlides() {
	if (!tvActiva()) { slides = []; return; }
	var c = config();
	var platos = platosElegidos();
	var ultimo = (slides.length && slides[slides.length - 1].platos)
		? slides[slides.length - 1].platos[slides[slides.length - 1].platos.length - 1] : null;
	if (c.aleatorio) platos = barajar(platos, ultimo);

	var nuevos = [];
	for (var i = 0; i < platos.length; i += c.por_slide) {
		nuevos.push({ platos: platos.slice(i, i + c.por_slide) });
	}

	/* La última pantalla no puede quedarse coja. Con 13 hamburguesas de tres en
	   tres, la quinta enseñaba UNA sola y enorme mientras las otras cuatro iban
	   completas: parece que se rompió algo.
	   Se resuelve corriendo la ventana hacia atrás — la última pasa a ser los
	   tres últimos platos —, así que se repiten los dos que ya salieron en la
	   anterior. Repetir dos platos se nota mucho menos que una pantalla a medias,
	   y es lo que hace cualquier cartelera.
	   Si no hay ni para llenar una, se deja como esté: rellenar duplicando
	   DENTRO del mismo slide sí se vería roto. */
	if (nuevos.length > 1) {
		var cola = nuevos[nuevos.length - 1].platos;
		if (cola.length < c.por_slide && platos.length >= c.por_slide) {
			nuevos[nuevos.length - 1] = { platos: platos.slice(platos.length - c.por_slide) };
		}
	}

	/* Los intercalados van al margen de 'por_slide'.

	   La rotación NO empieza de cero: sigue donde la dejó la vuelta anterior.
	   Esto es el arreglo de un fallo real. Rotando solo dentro de la vuelta, un
	   ciclo con un único hueco —seis pantallas de platos y una intercalada cada
	   cuatro, que es lo normal— enseñaba SIEMPRE el primer elemento y el
	   segundo no salía nunca. Hacían falta 'cada × elementos' pantallas de
	   platos para verlos todos, y casi ningún restaurante las tiene. */
	var intercalados = listaIntercalados();
	if (intercalados.length && nuevos.length) {
		var cada = ritmoIntercalado();
		var con = [];
		var turno = turnoIntercalado;
		for (var n = 0; n < nuevos.length; n++) {
			con.push(nuevos[n]);
			if ((n + 1) % cada === 0) {
				con.push(intercalados[turno % intercalados.length]);
				turno++;
			}
		}
		nuevos = con;
	}
	slides = nuevos;
}

/* ── ¿ESTA PROMOCIÓN TOCA AHORA? ──────────────────────────────────
   Copia de la regla de core/horarios.js, en el dialecto de aquí. No se puede
   importar aquel: usa módulos ES, declaraciones de bloque y encadenamiento
   opcional, y un televisor de 2017 no degrada eso — da error de sintaxis y la
   pantalla se queda negra durante todo un servicio (§2 de pantalla-tv.md).

   Las dos copias se comprueban contra el MISMO juego de casos
   (test/casos-programacion.json). Si se separan, la carta del QR dice que el
   dos por uno del martes está vigente y el televisor dice que no — y eso solo
   se nota los martes. */
function ahoraEnZona(zona, referencia) {
	/* Dentro y no fuera: así la función no depende de nada de su alrededor.
	   Estando fuera, quien la llamara sin arrastrar también esta variable caía
	   en el catch de abajo y se iba al reloj local SIN ENTERARSE — que es
	   exactamente lo que le pasó a la primera versión de su prueba, y pasaba
	   en verde porque esta máquina ya está en la hora de Colombia. */
	var DIAS_ABREV = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
	var d = referencia || new Date();
	try {
		if (typeof Intl !== 'undefined' && Intl.DateTimeFormat) {
			var f = new Intl.DateTimeFormat('en-US', {
				timeZone: zona, weekday: 'short', hour: '2-digit', minute: '2-digit',
				hour12: false, year: 'numeric', month: '2-digit', day: '2-digit'
			});
			/* formatToParts es de 2017 justo. En un televisor anterior no existe,
			   y pedirlo sin comprobar tiraría la pantalla entera. */
			if (f.formatToParts) {
				var partes = f.formatToParts(d), v = {};
				for (var i = 0; i < partes.length; i++) v[partes[i].type] = partes[i].value;
				var h = parseInt(v.hour, 10) % 24;
				return { dia: DIAS_ABREV[v.weekday],
				         minutos: h * 60 + parseInt(v.minute, 10),
				         fecha: v.year + '-' + v.month + '-' + v.day };
			}
		}
	} catch (e) { /* zona inválida o Intl a medias: se cae al reloj de abajo */ }

	/* Respaldo: el reloj del propio televisor. No es un mal sustituto — el
	   aparato está FÍSICAMENTE en el restaurante, así que su hora local suele
	   ser exactamente la que hace falta. */
	var mes = ('0' + (d.getMonth() + 1)).slice(-2), dia = ('0' + d.getDate()).slice(-2);
	return { dia: d.getDay(),
	         minutos: d.getHours() * 60 + d.getMinutes(),
	         fecha: d.getFullYear() + '-' + mes + '-' + dia };
}

function aMinutosDelDia(hhmm) {
	var m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm == null ? '' : hhmm));
	if (!m) return null;
	var h = +m[1], min = +m[2];
	return (h > 23 || min > 59) ? null : h * 60 + min;
}

function esFecha(v) { return /^\d{4}-\d{2}-\d{2}$/.test(String(v == null ? '' : v)); }

/* Ante cualquier configuración incompleta o inválida devuelve true: vale más
   enseñar de más que dejar a un restaurante sin promoción un sábado por la
   noche por un dato mal escrito. */
function vigenteAhora(h, zona, referencia) {
	if (!h || !h.activo) return true;

	var ahora = ahoraEnZona(zona, referencia);

	if (esFecha(h.desde_fecha) && ahora.fecha < h.desde_fecha) return false;
	if (esFecha(h.hasta_fecha) && ahora.fecha > h.hasta_fecha) return false;

	var desde = aMinutosDelDia(h.desde), hasta = aMinutosDelDia(h.hasta);
	var dias = (h.dias && h.dias.length) ? h.dias : [0, 1, 2, 3, 4, 5, 6];
	var enDia = function (d) { for (var i = 0; i < dias.length; i++) if (dias[i] === d) return true; return false; };

	if (desde === null || hasta === null || desde === hasta) return enDia(ahora.dia);
	if (desde < hasta) return enDia(ahora.dia) && ahora.minutos >= desde && ahora.minutos < hasta;

	/* Franja que cruza medianoche: la madrugada cuenta como la noche anterior. */
	if (ahora.minutos >= desde) return enDia(ahora.dia);
	if (ahora.minutos < hasta) return enDia((ahora.dia + 6) % 7);
	return false;
}

function tieneProgramacion(h) {
	if (!h || !h.activo) return false;
	return !!(h.dias && h.dias.length) ||
	       aMinutosDelDia(h.desde) !== null || aMinutosDelDia(h.hasta) !== null ||
	       esFecha(h.desde_fecha) || esFecha(h.hasta_fecha);
}

/* Las promociones que la cartelera puede enseñar ahora mismo.
   Dos niveles: si hay alguna programada vigente, las de fondo no juegan. */
function promocionesDeAhora(referencia) {
	var r = datos.restaurante;
	var zona = (r.atributos && r.atributos.zona_horaria) || 'America/Bogota';
	var todas = datos.promociones || [];
	var vivas = [], programadas = [], fondo = [];
	for (var i = 0; i < todas.length; i++) {
		var p = todas[i];
		if (!p || !p.activa || !p.en_tv) continue;
		if (!urlSegura(p.imagen_url)) continue;
		if (!vigenteAhora(p.programacion, zona, referencia)) continue;
		vivas.push(p);
		if (tieneProgramacion(p.programacion)) programadas.push(p); else fondo.push(p);
	}
	return programadas.length ? programadas : fondo;
}

/* ── LO QUE SE INTERCALA ENTRE LAS PANTALLAS DE PLATOS ────────────
   Antes solo cabía la promoción con su propia frecuencia. Ahora es una lista
   ordenada que rota por UN SOLO ritmo: cada 'cada' pantallas de platos entra
   el siguiente elemento de la lista, y al acabarla se vuelve a empezar.

   Un ritmo por tipo —el logo cada 3 y la promoción cada 4— se pelearía por la
   pantalla 12, y el restaurante no podría predecir qué ve mirando el panel.
   Con la lista, además, el coste se ve: añadir el logo le quita la mitad de
   los turnos a la promoción en vez de diluirla a escondidas, y la promoción es
   la que vende.

   Con un solo elemento la secuencia es idéntica a la de antes. */
function listaIntercalados() {
	var r = datos.restaurante;
	var t = (r.atributos && r.atributos.tv) || {};
	var lista = t.intercalados;

	/* Compatibilidad. Quien no haya vuelto a guardar la configuración no tiene
	   'intercalados', y su pantalla tiene que comportarse exactamente igual que
	   ayer: se arma la lista desde las columnas de siempre. Se puede quitar
	   cuando todos hayan guardado una vez. */
	if (!lista || !lista.length) {
		var hayEnTabla = false, tabla = datos.promociones || [];
		for (var j = 0; j < tabla.length; j++) if (tabla[j] && tabla[j].en_tv) hayEnTabla = true;
		lista = (r.promo_en_tv || hayEnTabla) ? [{ tipo: 'promocion' }] : [];
	}

	var puestos = [];
	for (var i = 0; i < lista.length; i++) {
		var it = lista[i] || {};
		if (it.tipo === 'promocion') {
			/* Una entrada 'promocion' se despliega en TODAS las promociones que
			   tocan ahora, no en una. La cartelera da vueltas todo el servicio:
			   repetirse no molesta, y tener tres promociones tiene que notarse en
			   pantalla y no solo en el panel.
			   Apagada, sin imagen o fuera de su día NO ocupa turno: dejarle el
			   hueco pintaría una pantalla vacía cada cuatro. */
			var deAhora = promocionesDeAhora();
			if (deAhora.length) {
				for (var k = 0; k < deAhora.length; k++) {
					puestos.push({ promo: { imagen: urlSegura(deAhora[k].imagen_url),
					                        nombre: deAhora[k].nombre || '',
					                        precio: deAhora[k].precio || '' } });
				}
			} else if (!(datos.promociones || []).length) {
				/* Respaldo para un restaurante cuya promoción no esté todavía en la
				   tabla. Solo si la tabla no trajo NADA: si trajo filas y ninguna
				   toca ahora, es que hoy no toca — y caer aquí sacaría una
				   promoción que el restaurante programó para otro día. */
				var img = urlSegura(r.promo_imagen_url);
				if (r.promo_activa && img) {
					puestos.push({ promo: { imagen: img,
					                        nombre: r.promo_nombre || '',
					                        precio: r.promo_precio || '' } });
				}
			}
		} else if (it.tipo === 'marca') {
			var logo = it.logo ? urlSegura(r.logo_url) : '';
			var frase = typeof it.frase === 'string' ? it.frase : '';
			/* Sin logo y sin frase no hay pantalla que pintar. */
			if (logo || frase) puestos.push({ marca: { logo: logo, frase: frase } });
		}
	}
	return puestos;
}

/* Cada cuántas pantallas de platos entra un intercalado. Es del televisor y no
   de la promoción: manda sobre cualquier intercalado, no solo sobre la promo.
   'promo_cada' queda de respaldo por lo mismo que arriba. */
function ritmoIntercalado() {
	var r = datos.restaurante;
	var t = (r.atributos && r.atributos.tv) || {};
	var cada = parseInt(t.cada, 10);
	if (!cada || cada < 1) cada = parseInt(r.promo_cada, 10);
	if (!cada || cada < 1) cada = 4;
	return cada;
}

/* ── LA TIPOGRAFÍA QUE ELIGIÓ EL RESTAURANTE ──────────────────────
   La cartelera llevaba Helvetica fija. El restaurante elegía su letra en el
   panel, la veía en la carta del QR, y en el televisor salía otra: la misma
   marca contándose de dos formas en el mismo local.

   El diseño lo había descartado por miedo a meter una petición de red que
   bloqueara el pintado en una pantalla que se enciende sola cada mañana. Se
   puede tener sin eso, con dos cuidados:

   El enlace se añade DESPUÉS de que la página ya esté pintada — cuando llegan
   los datos —, así que no retrasa el primer dibujo, que es lo que se temía.

   Y se pide con la letra de reserva activada, o sea que el texto se ve desde
   el primer momento con Helvetica y cambia cuando llega la buena. El peor
   caso —televisor sin internet, Google que no responde— es exactamente lo que
   se ve hoy. No hay escenario en que quede peor que antes.

   ── POR QUÉ SE VALIDA EL NOMBRE ──
   El nombre acaba dentro de una regla de estilo, y ahí un texto cualquiera se
   sale de su sitio y escribe reglas nuevas. Hoy solo lo pone el superadmin
   desde una lista cerrada, pero eso es una costumbre del panel, no una
   garantía del dato. Se acepta lo que de verdad puede ser una familia de
   Google —letras, cifras y espacios— y lo demás se ignora. Es la misma idea
   que urlSegura() unas líneas más arriba. */
var fuentesPuestas = '';

function nombreDeFuenteSeguro(n) {
	var s = String(n === null || n === undefined ? '' : n);
	return /^[A-Za-z0-9 ]{1,40}$/.test(s) ? s : '';
}

function aplicarFuentes() {
	var at = (datos.restaurante && datos.restaurante.atributos) || {};
	var titulo = nombreDeFuenteSeguro(at.fuente_titulo);
	var cuerpo = nombreDeFuenteSeguro(at.fuente_cuerpo);
	if (!titulo && !cuerpo) return;

	var familias = [];
	if (titulo) familias.push(titulo);
	if (cuerpo && cuerpo !== titulo) familias.push(cuerpo);

	/* aplicar() corre en cada cambio de configuración y el sondeo lo llama cada
	   cinco minutos. Sin esto, el televisor acumularía un enlace por hora. */
	var clave = familias.join('|');
	if (clave === fuentesPuestas) return;
	fuentesPuestas = clave;

	var partes = [];
	for (var i = 0; i < familias.length; i++) {
		partes.push('family=' + familias[i].replace(/ /g, '+') + ':wght@400;600;700');
	}
	var enlace = document.createElement('link');
	enlace.rel = 'stylesheet';
	enlace.href = 'https://fonts.googleapis.com/css2?' + partes.join('&') + '&display=swap';
	document.head.appendChild(enlace);

	var reserva = ', Helvetica, Arial, sans-serif';
	if (cuerpo) document.body.style.fontFamily = "'" + cuerpo + "'" + reserva;

	/* Los títulos, en la etiqueta de estilo vacía del encabezado. El nombre del
	   plato, el de la promoción, la frase de marca y el del reposo son los
	   cuatro sitios donde se lee la marca; el precio y la etiqueta de categoría
	   se quedan con la del cuerpo, que es la que se lee de un vistazo desde
	   lejos. */
	var reglas = document.getElementById('fuenteTitulos');
	if (titulo && reglas) {
		reglas.textContent = '.nombre, .promo-nombre, .marca-frase, #reposoNombre { font-family: ' +
			"'" + titulo + "'" + reserva + '; }';
	}
}

/* ── PRECARGA DE LA SIGUIENTE PANTALLA ────────────────────────────
   Las fotos se pedían en el momento de enseñarlas: se creaba el nodo con su
   background-image y el navegador empezaba a descargar justo cuando ya tenía
   que verse. Con la transición de entrada eso deja un hueco en el que la
   pantalla enseña el marco vacío con el nombre y el precio flotando encima.

   Dura poco porque las fotos se sirven con caché de un año: en cuanto pasa
   una vuelta entera, ya están todas guardadas y no se vuelve a pedir nada. El
   problema es CUÁNDO ocurre esa primera vuelta — al encender el televisor por
   la mañana, y otra vez tras cada recarga de seguridad. O sea, delante de los
   primeros clientes del día.

   Se pide una pantalla por delante y no dos. Con el mínimo de 4 segundos por
   slide hay margen de sobra para tres fotos, y pedir más a la vez las pone a
   competir con las de la pantalla que se está viendo ahora — que es a lo que
   hay que dar prioridad.

   Se apunta lo ya pedido para no repetir: con la última pantalla corrida hacia
   atrás y con la promoción intercalada, hay fotos que salen en dos slides. */
var yaPedidas = {};

function urlsDelSlide(s) {
	var urls = [];
	if (!s) return urls;
	if (s.promo) {
		if (s.promo.imagen) urls.push(s.promo.imagen);
		return urls;
	}
	if (s.marca) {
		if (s.marca.logo) urls.push(s.marca.logo);
		return urls;
	}
	var lista = s.platos || [];
	for (var i = 0; i < lista.length; i++) {
		var u = urlSegura(lista[i].imagen_url);
		if (u) urls.push(u);
	}
	return urls;
}

function precargar(s) {
	var urls = urlsDelSlide(s);
	for (var i = 0; i < urls.length; i++) {
		if (yaPedidas[urls[i]]) continue;
		yaPedidas[urls[i]] = true;
		/* Sin guardar la referencia a propósito: lo único que se quiere es que
		   el navegador la meta en su caché. El objeto se puede recoger en
		   cuanto termine, y la foto se queda. */
		var img = new Image();
		img.src = urls[i];
	}
}

/* ── PINTAR ──────────────────────────────────────────────────────── */

function nuevoNodo(tag, clase) {
	var e = document.createElement(tag);
	if (clase) e.className = clase;
	return e;
}

/* ── LA PALETA DE LA PÁGINA ───────────────────────────────────────────
 * El tema 'carta' toma los colores que el restaurante YA guardó para su menú,
 * en vez de pedirle que los configure otra vez. Es un espejo de applyStyles()
 * en core/loader.js: los mismos campos y los mismos valores por defecto, para
 * que la pantalla y la carta se parezcan de verdad. Si allí cambian, aquí
 * también.
 *
 * Nada de esto usa variables CSS, aunque sería lo natural. Este archivo se rige
 * por una sola regla —nada que un televisor de 2018 pueda no entender— y los
 * estilos se ponen en cada elemento al pintarlo, que es lo que ya se hacía con
 * los tamaños de letra. */

var NEUTRO = {
	fondo: '#0a0a0f', degradado: '', caja: '#16151f', borde: '',
	texto: '#ffffff', acento: '#ffd521', placa: 'rgba(10, 10, 15, 0.62)'
};

function aHex(rgb) {
	var s = '#';
	for (var i = 0; i < 3; i++) {
		var t = Math.max(0, Math.min(255, Math.round(rgb[i]))).toString(16);
		s += t.length === 1 ? '0' + t : t;
	}
	return s;
}

function rgba(rgb, alfa) {
	return 'rgba(' + Math.round(rgb[0]) + ', ' + Math.round(rgb[1]) + ', ' +
	       Math.round(rgb[2]) + ', ' + alfa + ')';
}

/* Mezcla hacia el blanco. Espejo de lightenHex() en core/loader.js. */
function aclarar(rgb, cuanto) {
	return [rgb[0] + (255 - rgb[0]) * cuanto,
	        rgb[1] + (255 - rgb[1]) * cuanto,
	        rgb[2] + (255 - rgb[2]) * cuanto];
}

/* Luminancia relativa de la WCAG. Cada canal se linealiza antes de pesarlo:
   sin eso, dos colores con números parecidos dan contrastes muy distintos. */
function luminancia(rgb) {
	var l = [];
	for (var i = 0; i < 3; i++) {
		var c = rgb[i] / 255;
		l.push(c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
	}
	return 0.2126 * l[0] + 0.7152 * l[1] + 0.0722 * l[2];
}

function contraste(a, b) {
	var la = luminancia(a), lb = luminancia(b);
	var alto = la > lb ? la : lb;
	var bajo = la > lb ? lb : la;
	return (alto + 0.05) / (bajo + 0.05);
}

/* Blanco o casi negro, el que se lea encima del fondo. Los fondos guardados hoy
   son todos oscuros, pero el panel deja cambiarlos, y una carta clara con texto
   blanco no se lee desde ninguna mesa. */
function textoSobre(fondo) {
	return contraste([255, 255, 255], fondo) >= contraste([20, 19, 28], fondo)
		? '#ffffff' : '#14131c';
}

/* Sube el color hacia el blanco hasta que se lea sobre el fondo. Aclarar en vez
   de sustituir mantiene el tono: el azul marino de un restaurante sigue siendo
   su azul, solo que visible. Dos de los nueve colores guardados lo necesitan
   —#0a4380 y #3d568c—, y sobre un fondo casi negro no se leen en absoluto. */
function legibleSobre(rgb, fondo, minimo) {
	var c = rgb;
	/* Con tope: si el fondo fuera blanco no habría forma de llegar al mínimo y
	   el bucle no terminaría nunca. */
	for (var i = 0; i < 24 && contraste(c, fondo) < minimo; i++) c = aclarar(c, 0.08);
	return c;
}

/* El fondo de la página, aparte, porque lo necesitan dos cálculos y uno de
   ellos no puede pedir la paleta entera sin morderse la cola. */
function fondoPagina() {
	if (config().tema !== 'carta') return canalHex(NEUTRO.fondo);
	var at = (datos && datos.restaurante && datos.restaurante.atributos) || {};
	return canalHex(at.color_dark) || canalHex('#0a0a0f');
}

/* El color del restaurante, aclarado lo justo para que se lea sobre el fondo.
   Lo usan el precio Y la etiqueta de categoría, y por eso vive aquí: cuando
   cada uno calculaba el suyo, un restaurante de azul marino sacaba la etiqueta
   en su azul original y el precio en otro más claro. Dos azules en la misma
   pantalla se leen como un fallo, no como un sistema. */
function acento() {
	var prim = canalHex(datos && datos.restaurante && datos.restaurante.color_primario);
	return prim ? legibleSobre(prim, fondoPagina(), 4.5) : null;
}

function paletaPagina() {
	if (config().tema !== 'carta') return NEUTRO;

	var r = (datos && datos.restaurante) || {};
	var at = r.atributos || {};
	/* Los mismos '||' que core/loader.js, y por el mismo motivo: en la base hay
	   cadenas vacías además de nulos, y '||' trata las dos igual. Un color
	   ilegible cae también aquí, porque canalHex devuelve nulo. */
	var fondo = fondoPagina();
	var caja  = canalHex(at.color_card) || canalHex('#1a1825');
	var borde = canalHex(at.color_border) ||
	            (canalHex(at.color_card) ? aclarar(caja, 0.30) : canalHex('#2a2640'));
	var prim  = canalHex(r.color_primario)   || canalHex('#cdfefe');
	var sec   = canalHex(r.color_secundario) || canalHex('#a374af');
	var ac    = acento() || legibleSobre(prim, fondo, 4.5);

	return {
		fondo: aHex(fondo),
		/* Un lavado muy flojo de los dos colores del restaurante en diagonal. Lo
		   justo para que el negro deje de ser el negro de fábrica, sin competir
		   con las fotos, que son lo que la gente mira. Se pone como imagen de
		   fondo aparte del color: si el televisor no entendiera el degradado, se
		   queda el color liso y no una pantalla en blanco. */
		degradado: 'linear-gradient(135deg, ' + rgba(prim, 0.11) + ' 0%, ' +
		           'rgba(0, 0, 0, 0) 46%, ' + rgba(sec, 0.09) + ' 100%)',
		caja: aHex(caja),
		borde: '0.2vmin solid ' + rgba(borde, 0.75),
		texto: textoSobre(fondo),
		acento: aHex(ac),
		placa: rgba(caja, 0.72)
	};
}

/* ── COLOR DE LA ETIQUETA DE CATEGORÍA ────────────────────────────────
 * Tres presets, no un selector de color libre. Un selector libre deja elegir
 * gris sobre gris o amarillo sobre blanco, y esto acaba colgado en una pared
 * donde nadie va a volver a mirarlo. El preset 'marca' reutiliza el color que
 * el restaurante YA guardó para su carta (color_primario), para que la
 * cartelera se parezca al menú sin pedirle que configure el color dos veces. */

/* Convierte '#3dd68c' o '#3d8' en sus tres canales. Devuelve null si no es un
 * color hexadecimal, que es lo que llega cuando la columna está vacía. */
function canalHex(hex) {
	if (typeof hex !== 'string') return null;
	var h = hex.replace('#', '');
	if (h.length === 3) {
		h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
	}
	if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
	return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
}

function paletaCategoria(c) {
	var OSCURO = { fondo: 'rgba(10, 10, 15, 0.62)', texto: '#e8e8ee' };
	if (c.color_categoria === 'claro') {
		return { fondo: 'rgba(255, 255, 255, 0.88)', texto: '#14131c' };
	}
	if (c.color_categoria !== 'marca') return OSCURO;

	/* El mismo acento que el precio, ya aclarado si hacía falta. Ver acento(). */
	var rgb = acento();
	/* Sin color guardado no hay nada que reutilizar: se vuelve al oscuro en vez
	   de inventarse uno. */
	if (!rgb) return OSCURO;

	/* Brillo percibido, no promedio de canales: el ojo pesa el verde seis veces
	   más que el azul. Es lo que decide si encima va texto negro o blanco, y no
	   se puede dejar fijo — hay cartas en amarillo y cartas en morado, y una
	   sola de las dos combinaciones sirve para cada una. */
	var brillo = (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000;
	/* Por rgba() y no a mano: acento() puede devolver canales con decimales
	   —aclarar() mezcla— y meterlos crudos en el CSS funciona pero ensucia. */
	return {
		fondo: rgba(rgb, 0.9),
		texto: brillo > 145 ? '#14131c' : '#ffffff'
	};
}

function pintarSlide(s) {
	var c = config();
	var pag = paletaPagina();
	var div = nuevoNodo('div', 'slide');

	if (s.promo) {
		var pr = nuevoNodo('div', 'promo');
		var pf = nuevoNodo('div', 'promo-foto');
		pf.style.backgroundImage = 'url("' + s.promo.imagen.replace(/"/g, '%22') + '")';
		pr.appendChild(pf);
		/* Nombre y precio solo si están puestos. Una pieza que ya lleva el texto
		   dibujado no necesita que se lo repitan debajo. */
		if (s.promo.nombre || s.promo.precio) {
			var pt = nuevoNodo('div', 'promo-texto');
			if (s.promo.nombre) {
				var pn = nuevoNodo('div', 'promo-nombre');
				pn.style.fontSize = '5vmin';
				pn.style.color = pag.texto;
				pn.textContent = s.promo.nombre;
				pt.appendChild(pn);
			}
			if (s.promo.precio) {
				var pp = nuevoNodo('div', 'promo-precio');
				pp.style.fontSize = '4.4vmin';
				pp.style.color = pag.acento;
				pp.textContent = s.promo.precio;
				pt.appendChild(pp);
			}
			pr.appendChild(pt);
		}
		div.appendChild(pr);
		return div;
	}

	if (s.marca) {
		var mc = nuevoNodo('div', 'marca');
		if (s.marca.logo) {
			/* La clase extra solo con frase: con el logo solo, centrado de verdad
			   se ve mejor que centrado y empujado hacia arriba por un margen. */
			var ml = nuevoNodo('img', 'marca-logo' + (s.marca.frase ? ' con-frase' : ''));
			ml.src = s.marca.logo;
			ml.alt = '';
			mc.appendChild(ml);
		}
		if (s.marca.frase) {
			var mf = nuevoNodo('div', 'marca-frase');
			/* Sin logo la frase es lo único en pantalla y puede ir más grande. */
			mf.style.fontSize = s.marca.logo ? '4.6vmin' : '6vmin';
			mf.style.color = pag.acento;
			mf.textContent = s.marca.frase;
			mc.appendChild(mf);
		}
		div.appendChild(mc);
		return div;
	}

	var fila = nuevoNodo('div', 'fila');
	/* Cuanto menos cabe en el slide, más grande puede ir la letra. */
	var tamNombre = [0, 4.6, 3.6, 2.9, 2.4][s.platos.length] || 2.4;
	var pal = paletaCategoria(c);
	for (var i = 0; i < s.platos.length; i++) {
		var p = s.platos[i];
		var plato = nuevoNodo('div', 'plato');

		var marcoFoto = nuevoNodo('div', 'marco-foto');
		marcoFoto.style.background = pag.caja;
		if (pag.borde) marcoFoto.style.border = pag.borde;
		var foto = nuevoNodo('div', 'foto');
		foto.style.backgroundImage = 'url("' + urlSegura(p.imagen_url).replace(/"/g, '%22') + '")';
		/* El acercamiento dura lo que dura el slide, así que va desde aquí y no
		   desde el CSS: el restaurante puede poner de 4 a 60 segundos. Se le
		   suma la transición para que no se pare en seco antes de fundirse. */
		foto.style.animationDuration = (c.segundos + 1) + 's';
		/* Cada plato empieza el acercamiento con un desfase pequeño. Todos a la
		   vez se lee como un zoom de la pantalla entera; escalonados, como tres
		   fotos que respiran. */
		foto.style.animationDelay = (i * 220) + 'ms';
		marcoFoto.appendChild(foto);

		if (c.mostrar_categoria) {
			var nomCat = nombreCategoria(p.categoria_id);
			if (nomCat) {
				/* A la esquina contraria del logo, que se dibuja encima de la
				   primera foto. Ver el comentario de '.categoria.derecha'. */
				var cat = nuevoNodo('div', marcaDerecha ? 'categoria' : 'categoria derecha');
				/* Más pequeña cuanto más se reparte la pantalla, igual que el
				   nombre del plato: si no, con cuatro platos tapa media foto.
				   Pero con suelo. Por debajo de 1,9vmin —unos 20 px en un
				   televisor de 1080— deja de leerse desde la mesa del fondo, y
				   una etiqueta que no se lee es solo un borrón sobre la foto. */
				cat.style.fontSize = Math.max(1.9, tamNombre * 0.58) + 'vmin';
				cat.style.background = pal.fondo;
				cat.style.color = pal.texto;
				cat.textContent = nomCat;
				marcoFoto.appendChild(cat);
			}
		}

		plato.appendChild(marcoFoto);

		var texto = nuevoNodo('div', 'texto');
		texto.style.animationDelay = (i * 220) + 'ms';
		var nom = nuevoNodo('div', 'nombre');
		nom.style.fontSize = tamNombre + 'vmin';
		nom.style.color = pag.texto;
		/* Con textContent, no escribiendo marcado: el nombre lo pone el restaurante
		   y aquí no hay nada que escapar porque no hay HTML que construir. */
		nom.textContent = p.nombre || '';
		texto.appendChild(nom);

		var pre = nuevoNodo('div', 'precio');
		pre.style.fontSize = (tamNombre * 0.92) + 'vmin';
		pre.style.color = pag.acento;
		pre.textContent = p.precio || '';
		texto.appendChild(pre);

		plato.appendChild(texto);
		fila.appendChild(plato);
	}
	div.appendChild(fila);
	return div;
}

function mostrarReposo(activo) {
	var r = document.getElementById('reposo');
	if (activo) {
		var logo = urlSegura(datos && datos.restaurante && datos.restaurante.logo_url);
		var img = document.getElementById('reposoLogo');
		if (logo) { img.src = logo; img.style.display = ''; } else { img.style.display = 'none'; }
		var titulo = document.getElementById('reposoNombre');
		titulo.textContent = (datos && datos.restaurante && datos.restaurante.nombre) || '';
		titulo.style.color = paletaPagina().acento;
		r.className = 'visible';
	} else {
		r.className = '';
	}
}

function avanzar() {
	/* Red de seguridad. El televisor se apaga al cerrar el local, así que la
	   página vive una jornada — pero un computador conectado por HDMI puede
	   quedarse encendido días, y ahí es donde se acumulan las fugas. Recargar
	   en la transición, nunca a media animación. */
	if (new Date().getTime() - arranque > REINICIO_MS) { window.location.reload(); return; }

	if (!tvActiva() || !slides.length) { mostrarReposo(true); return; }
	mostrarReposo(false);

	indice = (indice + 1) % slides.length;

	/* Empieza otra vuelta: se rota la lista de intercalados y se rehacen los
	   slides. Rehacerlos AQUÍ no interrumpe nada —el ciclo estaba volviendo a
	   empezar de todos modos—, y es lo que hace que con un solo hueco por
	   vuelta se vea la promoción en una y la marca en la siguiente.

	   Sin 'aleatorio' el resultado es idéntico salvo por el intercalado, porque
	   platosElegidos() devuelve el mismo orden. Con 'aleatorio' encendido
	   además se rebaraja, que es justo lo que esa casilla promete. */
	if (indice === 0) {
		turnoIntercalado++;
		construirSlides();
		if (!slides.length) { mostrarReposo(true); return; }
	}

	/* La marca cambia de esquina en cada slide: un panel OLED marca lo que se
	   queda quieto, y esto va a estar meses en la misma pantalla.
	   Se decide ANTES de pintar, no después, porque las etiquetas de categoría
	   se colocan en la esquina contraria y necesitan saber dónde va a caer. */
	marcaDerecha = !marcaDerecha;
	document.getElementById('marca').className = marcaDerecha ? 'derecha' : '';

	var cont = document.getElementById('slides');
	var nodo = pintarSlide(slides[indice]);
	cont.appendChild(nodo);

	/* Después de pedir las de esta pantalla, nunca antes: las que se están
	   viendo van primero. */
	precargar(slides[(indice + 1) % slides.length]);

	/* Un fotograma de margen para que el navegador registre opacidad 0 antes
	   de subirla; sin esto la transición no ocurre y el cambio es brusco. */
	setTimeout(function () { nodo.className = 'slide visible'; }, 30);

	var viejo = nodoActual;
	nodoActual = nodo;
	if (viejo) {
		viejo.className = 'slide';
		setTimeout(function () {
			if (viejo.parentNode) viejo.parentNode.removeChild(viejo);
		}, 1200);
	}
}

function reprogramar() {
	if (temporizador) clearInterval(temporizador);
	temporizador = setInterval(avanzar, config().segundos * 1000);
}

function aplicar(primeraVez) {
	var c0 = config();
	document.body.className =
		(c0.orientacion === 'vertical' ? 'vertical ' : '') +
		(c0.animacion === 'ninguna' ? '' : 'animada');
	/* Los colores de la página se ponen aquí, una vez por carga y por cambio de
	   configuración, y no en cada slide: el fondo no cambia entre pantallas. */
	var pag = paletaPagina();
	document.documentElement.style.backgroundColor = pag.fondo;
	document.body.style.backgroundColor = pag.fondo;
	document.body.style.backgroundImage = pag.degradado;
	document.body.style.color = pag.texto;
	document.getElementById('sinRed').style.color = pag.texto;
	/* Después del color y no antes: las dos cosas escriben en el estilo del
	   body, y así queda claro que no se pisan — una toca 'color', la otra
	   'font-family'. Se llama en cada aplicar() porque el restaurante puede
	   cambiar la letra desde el panel sin tocar el televisor, pero por dentro
	   solo hace algo cuando la elección cambió de verdad. */
	aplicarFuentes();

	var logo = urlSegura(datos.restaurante.logo_url);
	var marca = document.getElementById('marca');
	marca.style.background = pag.placa;
	if (logo) { marca.src = logo; marca.style.display = ''; } else { marca.style.display = 'none'; }
	document.title = datos.restaurante.nombre || 'Carta';

	construirSlides();
	if (primeraVez) { indice = -1; avanzar(); }
	reprogramar();
}

/* ── DATOS ───────────────────────────────────────────────────────── */

function guardarCache() {
	try { localStorage.setItem(CLAVE_CACHE + slug, JSON.stringify(datos)); } catch (e) {}
}

function leerCache() {
	try {
		var s = localStorage.getItem(CLAVE_CACHE + slug);
		return s ? JSON.parse(s) : null;
	} catch (e) { return null; }
}

function sinRed(activo) {
	var e = document.getElementById('sinRed');
	e.textContent = ultimoFallo || 'sin conexión';
	e.className = activo ? 'visible' : '';
}

/* Trae restaurante, categorías y productos. Si algo falla se conserva lo que
   ya había: una pantalla que sigue enseñando la carta de hace diez minutos es
   infinitamente mejor que una pantalla en blanco en la pared de un local. */
/* Las columnas se piden UNA POR UNA y nunca con asterisco, igual que en
   core/loader.js. Eso tiene una consecuencia que costó un despliegue: pedir
   una columna que no existe no devuelve un hueco, devuelve un 400 y se cae la
   petición entera. Aquí estaban 'promo_nombre', 'promo_precio', 'promo_en_tv'
   y 'promo_cada' antes de que existieran, y la pantalla se quedaba en el aviso
   de sin conexión con la red perfectamente.

   Desde el 05/09/2026 se pide también la tabla 'promociones', que es de donde
   sale la programación por días y horas. Esa consulta va aparte y su fallo NO
   corta la carga: los platos son el producto. */
function cargar(alTerminar) {
	pedir('restaurantes?slug=eq.' + encodeURIComponent(slug) + '&activo=is.true&select=' +
		'id,nombre,slug,logo_url,color_primario,color_secundario,atributos,' +
		'promo_activa,promo_imagen_url,promo_nombre,promo_precio,promo_en_tv,promo_cada',
		function (rs) {
			if (!rs || !rs.length) { alTerminar(false); return; }
			var r = rs[0];
			pedir('categorias?restaurante_id=eq.' + r.id + '&select=id,nombre,atributos', function (cats) {
				if (!cats) { alTerminar(false); return; }
				pedir('productos?restaurante_id=eq.' + r.id + '&disponible=is.true' +
					'&select=id,nombre,precio,imagen_url,categoria_id,disponible&order=orden.asc',
					function (prods) {
						if (!prods) { alTerminar(false); return; }
						/* Las promociones NO cortan la carga si fallan. Los platos son el
						   producto; una promoción es un adorno, y quedarse sin pantalla por
						   ella sería cambiar un problema pequeño por uno grande. Un null se
						   trata como "hoy no hay". */
						pedir('promociones?restaurante_id=eq.' + r.id +
							'&select=id,imagen_url,nombre,precio,activa,en_popup,en_tv,programacion,orden' +
							'&order=orden.asc',
							function (promos) {
								datos = { restaurante: r, categorias: cats, productos: prods,
								          promociones: promos || [] };
								guardarCache();
								alTerminar(true);
							});
					});
			});
		});
}

function sondear() {
	var antes = JSON.stringify(datos);
	cargar(function (ok) {
		sinRed(!ok);
		if (!ok) return;
		/* Solo se reconstruye si algo cambió de verdad: rehacer los slides en
		   cada sondeo reiniciaría el ciclo cada cinco minutos y el cliente
		   vería siempre los mismos primeros platos. */
		if (JSON.stringify(datos) !== antes) aplicar(false);
	});
}

/* ── ARRANQUE ────────────────────────────────────────────────────── */

if (!slug) {
	mostrarReposo(true);
} else {
	/* Se pinta primero lo último conocido, para que un arranque sin internet
	   —el local abre y el router todavía no levantó— enseñe algo igualmente. */
	var cache = leerCache();
	if (cache) { datos = cache; aplicar(true); sinRed(true); }

	cargar(function (ok) {
		sinRed(!ok);
		if (ok) aplicar(!cache);
		else if (!cache) mostrarReposo(true);
	});

	setInterval(sondear, SONDEO_MS);

	/* Si el televisor recupera la red, no esperar al siguiente sondeo. */
	if (window.addEventListener) window.addEventListener('online', sondear, false);
}

})();
</script>
</body>
</html>
