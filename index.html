<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<title>Cargando menú...</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">

		<style>
			/* ── VARIABLES BASE ──────────────────────────────────────────
				Cada restaurante sobreescribe estas desde loader.js usando document.documentElement.style.setProperty()
			*/
			:root {
				--primary:   #cdfefe;
				--secondary: #a374af;
				--accent:    #cdfefe;
				--accent2:   #a374af;
				--dark:      #0a0a0f;
				--surface:   #12111a;
				--card:      #1a1825;
				--card-hover:#221f30;
				--border:    #2a2640;
				--text:      #f0edf8;
				--text-muted:#b0b0b0;
				--text-dim:  #4a4560;
				--radius:    12px;
				--font-titulo: inherit;
				--font-cuerpo: inherit;
			}

			* { 
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				-webkit-tap-highlight-color: transparent; 
			}
			
			html { 
				scroll-behavior: smooth; 
			}

			body {
				/* Color/degradado real: lo fija loader.js inline según
				   atributos.fondo_color / fondo_intensidad (o la imagen
				   de fondo_url si el restaurante tiene una). Esto es solo
				   el valor antes de que cargue la data. */
				background-color: var(--dark);
				color: var(--text);
				font-family: var(--font-cuerpo, 'system-ui', sans-serif);
				font-size: 14px;
				min-height: 100vh;
				overflow-x: hidden;
			}

			/* Overlay oscuro sobre la imagen de fondo */
			body::before {
				content: '';
				position: fixed; inset: 0;
				background: rgba(10, 10, 15, 0.82);
				z-index: 0;
				pointer-events: none;
			}

			/* Todo el contenido por encima del overlay */
			.header, .nav-sticky, main, .footer,
			.social-bar, .scroll-top { 
				position: relative; 
				z-index: 1; 
			}

			/* ══════════════════════════════════════════════════════════
			   TEMA: TOPNAV  (nav horizontal sticky — ej: Bonzas)
			   Se activa cuando atributos.nav = 'topnav' (default)
			══════════════════════════════════════════════════════════ */

			/* Header hero centrado */
			.header-hero {
				position: relative;
				width: 100%;
				padding: 36px 20px 24px;
				text-align: center;
				background: linear-gradient(180deg, rgba(10,10,15,0.6) 0%, transparent 100%);
			}
			/* Cuando el hero aparece debajo del header fijo (temas sidebar/carrito
			   con "mostrar mensaje de bienvenida" activo), hay que bajarlo 60px
			   para que no quede tapado por el header-fixed. */
			.header-hero.under-fixed-header { padding-top: 76px; }
			.hero-logo {
				width: 90px; height: 90px;
				object-fit: contain;
				border-radius: 50%;
				border: 2px solid var(--primary);
				margin-bottom: 10px;
				box-shadow: 0 0 28px rgba(205,254,254,0.18), 0 0 60px rgba(205,254,254,0.12);
			}
			.hero-title {
				font-family: var(--font-titulo, inherit);
				font-size: 42px;
				letter-spacing: 5px;
				color: var(--primary);
				line-height: 1;
			}
			.hero-sub {
				font-size: 11px;
				color: var(--accent2);
				letter-spacing: 3px;
				text-transform: uppercase;
				margin-top: 4px;
			}

			/* Nav horizontal */
			.nav-sticky {
				position: sticky; top: 0; z-index: 100;
				background: rgba(10,10,15,0.92);
				backdrop-filter: blur(12px);
				border-bottom: 1px solid var(--border);
			}
			.nav-scroll {
				display: flex;
				overflow-x: auto;
				scrollbar-width: none;
				gap: 4px;
				padding: 10px 12px;
			}
			.nav-scroll::-webkit-scrollbar { display: none; }
			.nav-btn {
				flex-shrink: 0;
				padding: 7px 14px;
				border-radius: 20px;
				border: 1px solid var(--border);
				background: transparent;
				color: var(--text-muted);
				font-size: 12px;
				font-weight: 500;
				cursor: pointer;
				white-space: nowrap;
				transition: all 0.2s;
			}
			.nav-btn.active {
				border-color: var(--primary);
				color: var(--primary);
				box-shadow: 0 0 10px rgba(205,254,254,0.18);
			}

			/* ══════════════════════════════════════════════════════════
			   TEMA: SIDEBAR  (nav lateral hamburguesa — ej: Malparados)
			   Se activa cuando atributos.nav = 'sidebar'
			══════════════════════════════════════════════════════════ */

			/* Header fijo */
			.header-fixed {
				position: fixed;
				top: 0; left: 0; right: 0;
				height: 60px;
				background: var(--surface);
				border-bottom: 2px solid var(--primary);
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 16px;
				z-index: 100;
			}
			.menu-toggle {
				background: none; border: none;
				color: var(--primary);
				font-size: 24px; cursor: pointer;
				display: flex; flex-direction: column;
				gap: 4px; padding: 8px;
			}
			.menu-toggle span {
				display: block;
				width: 24px; height: 3px;
				background: var(--primary);
				border-radius: 2px;
				box-shadow: 0 0 5px var(--primary);
			}
			.logo-header {
				font-family: var(--font-titulo, inherit);
				font-size: 22px;
				color: var(--primary);
				letter-spacing: 2px;
				text-transform: uppercase;
				text-shadow: 0 0 10px var(--primary), 0 0 20px color-mix(in srgb, var(--primary) 60%, transparent);
			}

			/* Sidebar */
			.sidebar {
				position: fixed;
				left: -100%; top: 0;
				width: 75%; max-width: 300px;
				height: 100vh;
				background: rgba(10,10,15,0.98);
				backdrop-filter: blur(10px);
				border-right: 2px solid var(--primary);
				z-index: 200;
				transition: left 0.3s cubic-bezier(0.4,0,0.2,1);
				overflow-y: auto;
				padding-top: 60px;
			}
			.sidebar.open { left: 0; }
			.sidebar-header {
				padding: 20px 16px;
				border-bottom: 1px solid var(--border);
				display: flex;
				align-items: center;
				justify-content: space-between;
			}
			.sidebar-title {
				font-family: var(--font-titulo, inherit);
				font-size: 20px;
				color: var(--primary);
				text-transform: uppercase;
				text-shadow: 0 0 8px var(--primary);
			}
			.close-menu {
				background: none; border: none;
				color: var(--text);
				font-size: 24px; cursor: pointer;
			}
			.sidebar-nav { display: flex; flex-direction: column; }
			.sidebar-link {
				padding: 16px 20px;
				border-bottom: 1px solid var(--border);
				color: var(--text);
				text-decoration: none;
				font-weight: 600;
				font-size: 14px;
				text-transform: uppercase;
				cursor: pointer;
				background: transparent;
				border-left: none; border-right: none; border-top: none;
				width: 100%; text-align: left;
				transition: all 0.2s;
			}
			.sidebar-link:hover, .sidebar-link.active {
				background: rgba(205,254,254,0.1);
				color: var(--primary);
				border-left: 4px solid var(--primary);
				padding-left: 16px;
			}
			.overlay {
				position: fixed; inset: 0;
				background: rgba(0,0,0,0.7);
				z-index: 150;
				opacity: 0; pointer-events: none;
				transition: opacity 0.3s;
			}
			.overlay.open { opacity: 1; pointer-events: all; }

			/* ══════════════════════════════════════════════════════════
			   TEMA: CARRITO  (header fijo + sidebar + carrito → WhatsApp)
			   Se activa cuando atributos.nav = 'carrito'
			   Reutiliza header-fixed / sidebar / overlay del tema SIDEBAR.
			══════════════════════════════════════════════════════════ */

			.cart-btn {
				position: relative;
				background: none;
				border: 2px solid var(--primary);
				color: var(--primary);
				width: 40px; height: 40px;
				border-radius: 8px;
				cursor: pointer;
				display: flex; align-items: center; justify-content: center;
				font-size: 18px;
				transition: all 0.2s;
			}
			.cart-btn:active { transform: scale(0.95); }
			.cart-count {
				position: absolute; top: -8px; right: -8px;
				background: var(--primary); color: var(--dark);
				width: 20px; height: 20px; border-radius: 50%;
				display: flex; align-items: center; justify-content: center;
				font-size: 11px; font-weight: 700;
			}

			.card-add-btn {
				position: absolute; bottom: 10px; right: 10px;
				width: 32px; height: 32px; border-radius: 50%;
				background: var(--secondary); color: #fff;
				border: none; font-size: 18px; font-weight: 700;
				cursor: pointer; display: flex; align-items: center; justify-content: center;
				transition: transform 0.18s;
			}
			.card-add-btn:active { transform: scale(0.92); }
			.card-hint { font-size: 10px; color: var(--primary); margin-top: 4px; letter-spacing: 0.5px; }

			/* Carrito lateral */
			.cart-sidebar {
				position: fixed; right: -100%; top: 0;
				width: 100%; max-width: 350px; height: 100vh;
				background: var(--surface);
				border-left: 2px solid var(--primary);
				z-index: 250;
				transition: right 0.3s cubic-bezier(0.4,0,0.2,1);
				display: flex; flex-direction: column;
			}
			.cart-sidebar.open { right: 0; }
			.cart-header {
				padding: 16px; border-bottom: 1px solid var(--border);
				display: flex; justify-content: space-between; align-items: center;
				flex-shrink: 0;
			}
			.cart-header h3 { font-family: var(--font-titulo, inherit); font-size: 18px; color: var(--primary); }
			.close-cart { background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; }
			.cart-items { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; }
			.cart-item {
				background: var(--card); border: 1px solid var(--border);
				border-radius: 6px; padding: 12px; margin-bottom: 10px;
				display: flex; justify-content: space-between; align-items: center; gap: 8px;
			}
			.cart-item-info { flex: 1; min-width: 0; }
			.cart-item-name { font-weight: 600; color: var(--text); margin-bottom: 4px; font-size: 13px; }
			.cart-item-desc { font-size: 10px; color: var(--text-dim); margin-top: 2px; line-height: 1.4; word-break: break-word; }
			.cart-item-price { color: var(--secondary); font-size: 12px; font-weight: 700; }
			.cart-item-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
			.cart-item-controls { display: flex; align-items: center; gap: 8px; }
			.cart-item-btn {
				background: var(--primary); color: var(--dark); border: none;
				width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-weight: 700;
			}
			.cart-item-qty { width: 24px; text-align: center; color: var(--text); font-weight: 600; font-size: 13px; }
			.cart-item-remove {
				background: rgba(255,255,255,0.08); color: var(--text-muted); border: none;
				width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-size: 12px;
			}
			.btn-edit-cart {
				background: transparent; color: var(--primary); border: 1px solid var(--primary);
				border-radius: 4px; padding: 3px 8px; font-size: 10px; cursor: pointer; white-space: nowrap;
			}
			.cart-empty {
				display: flex; flex-direction: column; align-items: center; justify-content: center;
				height: 200px; color: var(--text-muted); text-align: center; gap: 4px;
			}
			.cart-footer { padding: 16px; border-top: 1px solid var(--border); background: var(--card); flex-shrink: 0; }
			.cart-total { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 16px; font-weight: 700; }
			.cart-total span { color: var(--text-muted); }
			.cart-total strong { color: var(--secondary); }
			.btn-checkout, .btn-send-order {
				width: 100%; padding: 12px; background: var(--primary); color: var(--dark);
				border: none; border-radius: 8px; font-weight: 700; font-size: 13px;
				cursor: pointer; transition: transform 0.18s;
			}
			.btn-checkout:active, .btn-send-order:active { transform: scale(0.98); }

			/* Checkout */
			.checkout-overlay {
				position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 300;
				display: flex; align-items: flex-end; justify-content: center;
				opacity: 0; pointer-events: none; transition: opacity 0.25s;
			}
			.checkout-overlay.open { opacity: 1; pointer-events: all; }
			.checkout-modal {
				width: 100%; max-width: 100%; background: var(--surface);
				border-top: 2px solid var(--primary); border-radius: 20px 20px 0 0;
				padding: 20px; max-height: 90vh; overflow-y: auto;
				transform: translateY(100%); transition: transform 0.3s ease;
			}
			.checkout-overlay.open .checkout-modal { transform: translateY(0); }
			@media (min-width: 600px) {
				.checkout-overlay { align-items: center; }
				.checkout-modal { max-width: 460px; border-radius: 16px; transform: translateY(20px); }
				.checkout-overlay.open .checkout-modal { transform: translateY(0); }
			}
			.checkout-header {
				display: flex; justify-content: space-between; align-items: center;
				margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
			}
			.checkout-header h3 { font-family: var(--font-titulo, inherit); font-size: 19px; color: var(--primary); }
			.close-checkout { background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer; }
			.checkout-form-group { margin-bottom: 14px; }
			.checkout-form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: var(--text); font-size: 12px; }
			.checkout-form-group input, .checkout-form-group textarea, .checkout-form-group select {
				width: 100%; padding: 10px; background: var(--card); border: 1px solid var(--border);
				border-radius: 6px; color: var(--text); font-family: var(--font-cuerpo, inherit); font-size: 13px; outline: none;
			}
			.checkout-form-group input:focus, .checkout-form-group textarea:focus, .checkout-form-group select:focus { border-color: var(--primary); }
			.checkout-summary { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 16px; font-size: 12px; }
			.checkout-summary-item { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; color: var(--text-muted); }
			.checkout-summary-total { display: flex; justify-content: space-between; padding-top: 8px; border-top: 1px solid var(--border); color: var(--secondary); font-weight: 700; }

			/* Modal de personalización (toppings) */
			.custom-overlay {
				position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 400;
				display: flex; align-items: flex-end; justify-content: center;
				opacity: 0; pointer-events: none; transition: opacity 0.25s;
			}
			.custom-overlay.open { opacity: 1; pointer-events: all; }
			.custom-modal {
				width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
				background: var(--surface); border-top: 2px solid var(--primary);
				border-radius: 20px 20px 0 0; padding: 20px;
				transform: translateY(100%); transition: transform 0.3s ease;
			}
			.custom-overlay.open .custom-modal { transform: translateY(0); }
			@media (min-width: 600px) {
				.custom-overlay { align-items: center; }
				.custom-modal { border-radius: 16px; transform: translateY(20px); }
				.custom-overlay.open .custom-modal { transform: translateY(0); }
			}
			.custom-head {
				display: flex; justify-content: space-between; align-items: center;
				margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
			}
			.custom-name { font-family: var(--font-titulo, inherit); font-size: 22px; color: var(--primary); }
			.custom-base-price { font-size: 13px; color: var(--primary); font-weight: 700; }
			.custom-close { background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; }
			.custom-total-row {
				background: var(--card); border: 1px solid var(--secondary); border-radius: 8px;
				padding: 12px 16px; margin-bottom: 20px;
				display: flex; justify-content: space-between; align-items: center;
			}
			.custom-total-row span:first-child { font-size: 13px; color: var(--text-muted); }
			.custom-total-value { font-family: var(--font-titulo, inherit); font-size: 22px; color: var(--primary); }
			.custom-section { margin-bottom: 18px; }
			.custom-section-title { font-family: var(--font-titulo, inherit); font-size: 15px; color: var(--primary); margin-bottom: 4px; letter-spacing: 1px; }
			.custom-section-hint { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; }
			.custom-chip-list { display: flex; flex-wrap: wrap; gap: 8px; }
			.custom-chip {
				padding: 7px 12px; border-radius: 20px; border: 1px solid var(--border);
				background: var(--card); color: var(--text-muted);
				font-family: var(--font-cuerpo, inherit); font-size: 12px; cursor: pointer;
				transition: all 0.18s; white-space: nowrap;
			}
			.custom-chip.active { border-color: var(--secondary); background: rgba(255,255,255,0.06); color: var(--primary); }
			.custom-qty-row {
				display: flex; align-items: center; justify-content: center; gap: 16px;
				margin-bottom: 20px; padding: 12px; background: var(--card); border-radius: 8px;
			}
			.custom-qty-btn {
				background: var(--secondary); color: #fff; border: none;
				width: 34px; height: 34px; border-radius: 50%; font-size: 18px; font-weight: 700; cursor: pointer;
			}
			.custom-qty-value { font-family: var(--font-titulo, inherit); font-size: 24px; color: var(--text); min-width: 36px; text-align: center; }

			/* ══════════════════════════════════════════════════════════
			   COMPONENTES COMPARTIDOS (todos los temas)
			══════════════════════════════════════════════════════════ */

			/* Área principal */
			main {
				padding: 20px 12px 100px;
				max-width: 720px;
				margin: 0 auto;
			}
			main.with-fixed-header { margin-top: 60px; }

			/* Categoría */
			.category-section { margin-bottom: 36px; }
			.category-header {
				display: flex; align-items: center;
				gap: 12px; margin-bottom: 16px;
			}
			.category-title {
				font-family: var(--font-titulo, inherit);
				font-size: 24px;
				color: var(--primary);
				text-transform: uppercase;
				white-space: nowrap;
			}
			.category-line {
				flex: 1; height: 2px;
				background: linear-gradient(90deg, var(--primary) 0%, transparent 100%);
				box-shadow: 0 0 5px var(--primary);
			}

			/* Grid */
			.products-grid {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 10px;
			}
			@media (min-width: 600px) {
				.products-grid { grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
			}

			/* Card */
			.product-card {
				background: var(--card);
				border-radius: var(--radius);
				overflow: hidden;
				border: 1px solid var(--border);
				cursor: pointer;
				transition: transform 0.18s, border-color 0.18s;
			}
			.product-card:active { transform: scale(0.97); }
			.product-card.has-img:hover { border-color: var(--primary); }
			.card-img-wrap {
				position: relative; width: 100%;
				aspect-ratio: 1/1;
				background: var(--surface); overflow: hidden;
			}
			.card-img {
				width: 100%; height: 100%;
				object-fit: cover; transition: transform 0.3s;
			}
			.product-card:active .card-img { transform: scale(1.04); }
			.no-img-placeholder {
				width: 100%; height: 100%;
				display: flex; align-items: center; justify-content: center;
				background: linear-gradient(135deg, var(--surface), var(--card-hover));
			}
			.no-img-placeholder svg { opacity: 0.2; }
			.card-body { padding: 10px 10px 12px; }
			.card-name {
				font-family: var(--font-titulo, inherit);
				font-size: 14px; color: var(--text);
				margin-bottom: 4px; line-height: 1.2;
			}
			.card-price { font-size: 13px; font-weight: 600; color: var(--primary); }

			/* Producto sin imagen: fila compacta en vez de tarjeta con placeholder
			   (mismo criterio que las categorías "sin fotos", pero por producto) */
			.product-noimg {
				grid-column: 1 / -1;
				display: flex; justify-content: space-between; align-items: center;
				gap: 10px;
				background: var(--card);
				border: 1px solid var(--border);
				border-radius: var(--radius);
				padding: 12px 14px;
				cursor: pointer;
				transition: background 0.2s;
			}
			.product-noimg:hover { background: var(--card-hover); }
			.noimg-add-indicator {
				width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
				background: var(--accent2); color: #fff;
				display: flex; align-items: center; justify-content: center;
				font-size: 15px; font-weight: 700;
			}

			/* Lista (sin fotos) */
			.products-list {
				display: flex; flex-direction: column;
				gap: 1px;
				background: var(--border);
				border-radius: var(--radius); overflow: hidden;
			}
			.list-item {
				display: flex;
				justify-content: space-between; align-items: center;
				background: var(--card);
				padding: 12px 14px; gap: 8px;
				cursor: pointer; transition: background 0.2s;
			}
			.list-item:hover { background: var(--card-hover); }
			.list-name { font-size: 13px; color: var(--text); flex: 1; }
			.list-desc-avanzada { display: block; font-size: 11px; color: var(--text-dim); margin-top: 2px; }
			.list-price { font-size: 13px; color: var(--primary); font-weight: 500; white-space: nowrap; }

			/* Modal */
			.modal-overlay {
				position: fixed; inset: 0;
				background: rgba(0,0,0,0.85);
				z-index: 500;
				display: flex; align-items: flex-end;
				opacity: 0; pointer-events: none;
				transition: opacity 0.25s;
			}
			.modal-overlay.open { opacity: 1; pointer-events: all; }
			.modal-sheet {
				width: 100%; max-height: 88vh;
				background: var(--surface);
				border-radius: 20px 20px 0 0;
				overflow: hidden;
				display: flex; flex-direction: column;
				transform: translateY(100%);
				transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
			}
			.modal-overlay.open .modal-sheet { transform: translateY(0); }
			@media (min-width: 600px) {
				.modal-overlay { align-items: center; }
				.modal-sheet {
					max-width: 500px; margin: 0 auto;
					border-radius: 20px;
					transform: translateY(20px);
				}
			}
			.modal-img-wrap {
				position: relative; width: 100%;
				aspect-ratio: 4/3;
				background: var(--card); flex-shrink: 0; overflow: hidden;
			}
			.modal-img {
				width: 100%; height: 100%;
				object-fit: cover; cursor: zoom-in; transition: transform 0.3s;
			}
			.modal-img-wrap:active .modal-img { transform: scale(1.03); }
			.modal-no-img {
				width: 100%; height: 100%;
				display: flex; align-items: center; justify-content: center;
				background: linear-gradient(135deg, var(--card), var(--card-hover));
			}
			.modal-close-btn {
				position: absolute; top: 12px; right: 12px;
				width: 36px; height: 36px; border-radius: 50%;
				background: rgba(0,0,0,0.6);
				border: none; color: white;
				font-size: 18px; cursor: pointer;
				display: flex; align-items: center; justify-content: center;
				z-index: 10; backdrop-filter: blur(4px);
			}
			.modal-nav {
				position: absolute; top: 50%; transform: translateY(-50%);
				width: 36px; height: 36px;
				background: rgba(0,0,0,0.55);
				border: 1px solid rgba(255,255,255,0.15);
				border-radius: 50%; color: white;
				font-size: 16px; cursor: pointer;
				display: flex; align-items: center; justify-content: center;
				z-index: 10; backdrop-filter: blur(4px);
			}
			.modal-nav-prev { left: 10px; }
			.modal-nav-next { right: 10px; }
			.modal-body { padding: 18px 20px 28px; overflow-y: auto; flex: 1; }
			.modal-name {
				font-family: var(--font-titulo, inherit);
				font-size: 26px; color: var(--primary);
				margin-bottom: 4px; line-height: 1.1;
			}
			.modal-desc-avanzada {
				font-size: 11px; color: var(--accent2);
				letter-spacing: 0.5px; margin-bottom: 6px;
			}
			.modal-price { font-size: 20px; font-weight: 600; color: var(--primary); margin-bottom: 12px; }
			.modal-desc { font-size: 13px; line-height: 1.65; color: var(--text-muted); }
			.modal-counter { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 14px; letter-spacing: 1px; }

			/* Carrusel modal */
			.modal-carousel { position: relative; width: 100%; height: 100%; overflow: hidden; }
			.carousel-track { display: flex; height: 100%; transition: transform 0.3s ease; }
			.carousel-slide { flex-shrink: 0; width: 100%; height: 100%; }
			.carousel-slide img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
			.carousel-dots {
				position: absolute; bottom: 8px; left: 0; right: 0;
				display: flex; justify-content: center; gap: 5px; z-index: 5;
			}
			.carousel-dot {
				width: 6px; height: 6px; border-radius: 50%;
				background: rgba(255,255,255,0.4); cursor: pointer; transition: background 0.2s;
			}
			.carousel-dot.active { background: var(--primary); }

			/* Lightbox */
			.lightbox {
				position: fixed; inset: 0;
				background: rgba(0,0,0,0.95); z-index: 900;
				display: flex; align-items: center; justify-content: center;
				opacity: 0; pointer-events: none; transition: opacity 0.2s;
			}
			.lightbox.open { opacity: 1; pointer-events: all; }
			.lightbox img { max-width: 95vw; max-height: 90vh; object-fit: contain; border-radius: 8px; }
			.lightbox-close {
				position: absolute; top: 16px; right: 16px;
				width: 40px; height: 40px; border-radius: 50%;
				background: rgba(255,255,255,0.1); border: none;
				color: white; font-size: 20px; cursor: pointer;
				display: flex; align-items: center; justify-content: center;
			}

			/* Promo modal */
			.promo-overlay {
				position: fixed; inset: 0;
				background: rgba(0,0,0,0.88); z-index: 800;
				display: flex; align-items: center; justify-content: center;
				padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.35s;
			}
			.promo-overlay.open { opacity: 1; pointer-events: all; }
			.promo-box {
				position: relative; width: 100%; max-width: 460px;
				border: 2px solid var(--primary);
				border-radius: 12px;
				overflow: hidden;
				box-shadow: 0 0 30px color-mix(in srgb, var(--primary) 45%, transparent);
				transform: scale(0.88); transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
			}
			.promo-overlay.open .promo-box { transform: scale(1); }
			.promo-img { width: 100%; display: block; }
			.promo-close {
				position: absolute; top: 12px; right: 12px;
				width: 36px; height: 36px; border-radius: 50%;
				background: rgba(0,0,0,0.7); border: 1px solid var(--primary); color: var(--primary);
				font-size: 18px; cursor: pointer;
				display: flex; align-items: center; justify-content: center;
				transition: all 0.2s;
			}
			.promo-close:hover {
				background: color-mix(in srgb, var(--primary) 20%, transparent);
				box-shadow: 0 0 10px var(--primary);
			}

			/* Scroll top */
			.scroll-top {
				position: fixed; bottom: 20px; right: 16px;
				width: 42px; height: 42px; border-radius: 50%;
				background: var(--accent2); border: none; color: white;
				font-size: 18px; cursor: pointer;
				display: flex; align-items: center; justify-content: center;
				opacity: 0; transform: translateY(10px);
				transition: opacity 0.25s, transform 0.25s; z-index: 200;
			}
			.scroll-top.visible { opacity: 1; transform: translateY(0); }

			/* Barra social */
			.social-bar {
				position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
				z-index: 200; display: flex; gap: 8px;
				background: rgba(18,17,26,0.82);
				backdrop-filter: blur(14px);
				border: 1px solid var(--border);
				border-radius: 40px; padding: 10px 18px;
			}
			.social-btn {
				display: flex; flex-direction: column;
				align-items: center; gap: 4px;
				padding: 6px 12px; border-radius: 24px;
				color: var(--text-muted); text-decoration: none;
				transition: color 0.2s, background 0.2s;
			}
			.social-btn svg { width: 22px; height: 22px; }
			.social-btn span { font-size: 10px; letter-spacing: 0.5px; }
			.social-btn:hover, .social-btn:active { color: var(--primary); }
			/* cuando hay barra social, subir scroll-top */
			body:has(.social-bar) .scroll-top { bottom: 90px; }

			/* Footer */
			.footer {
				text-align: center; padding: 20px;
				font-size: 11px; color: var(--text-dim); letter-spacing: 1px;
			}

			/* Crédito de la plataforma (planes sin marca blanca) */
			.vm-credito {
				text-align: center; padding: 4px 20px 22px;
				font-size: 10px; letter-spacing: 1px;
			}
			.vm-credito a {
				color: var(--text-dim); text-decoration: none;
				opacity: .75; transition: opacity .2s;
			}
			.vm-credito a:hover { opacity: 1; }

			/* ══════════════════════════════════════════════════════════
			   TEMA: EXPLORAR  (portada + búsqueda + filtros + banners)
			   Se activa con atributos.nav = 'explorar'. Todo el DOM lo
			   construye temas/explorar.js; aquí van sus estilos.
			══════════════════════════════════════════════════════════ */
			body.tema-explorar { }
			.exp-main { max-width: 520px; margin: 0 auto; padding: 0 !important; }

			/* Controles superiores fijos */
			.exp-top {
				position: fixed; top: 0; left: 50%; transform: translateX(-50%);
				width: 100%; max-width: 520px; z-index: 60;
				display: flex; align-items: flex-start; justify-content: space-between;
				gap: 10px; padding: 14px 16px; pointer-events: none;
			}
			.exp-top-left, .exp-top-right { pointer-events: all; display: flex; align-items: center; gap: 8px; }
			.exp-iconbtn {
				width: 44px; height: 44px; border-radius: 50%;
				background: rgba(10,10,15,0.72); backdrop-filter: blur(16px);
				border: 1px solid var(--border); color: var(--text);
				display: flex; align-items: center; justify-content: center; cursor: pointer;
				transition: all 0.2s;
			}
			.exp-iconbtn:hover, .exp-iconbtn.active { border-color: var(--primary); color: var(--primary); }
			.exp-viewtoggle {
				display: flex; gap: 2px; padding: 4px;
				background: rgba(10,10,15,0.72); backdrop-filter: blur(16px);
				border: 1px solid var(--border); border-radius: 24px;
			}
			.exp-viewbtn {
				width: 36px; height: 36px; border-radius: 20px;
				background: transparent; border: none; color: var(--text-muted);
				display: flex; align-items: center; justify-content: center; cursor: pointer;
				transition: all 0.2s;
			}
			.exp-viewbtn.active { background: var(--text); color: var(--dark); }

			/* Barra de búsqueda desplegable */
			.exp-searchbar {
				position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
				width: 100%; max-width: 520px; z-index: 55; padding: 0 16px;
				opacity: 0; height: 0; overflow: hidden; pointer-events: none;
				transition: all 0.25s;
			}
			.exp-searchbar.open { opacity: 1; height: auto; padding-top: 6px; padding-bottom: 10px; pointer-events: all; }
			.exp-search-wrap {
				display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px;
				background: rgba(10,10,15,0.94); backdrop-filter: blur(20px);
				border: 1px solid var(--border); border-radius: 24px; color: var(--text-muted);
			}
			.exp-search-wrap input {
				flex: 1; background: none; border: none; outline: none;
				color: var(--text); font-size: 15px; font-family: var(--font-cuerpo, inherit);
			}
			.exp-search-wrap input::placeholder { color: var(--text-muted); }
			.exp-search-clear { background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; }

			/* Panel de filtros desplegable */
			.exp-filterpanel {
				position: fixed; top: 62px; left: 50%; transform: translateX(-50%);
				width: 100%; max-width: 520px; z-index: 54; padding: 0 16px;
				opacity: 0; max-height: 0; overflow: hidden; pointer-events: none;
				transition: all 0.25s;
			}
			.exp-filterpanel.open { opacity: 1; max-height: 200px; padding-top: 6px; pointer-events: all; }
			.exp-filter-row {
				display: flex; flex-wrap: wrap; gap: 8px; padding: 12px;
				background: rgba(10,10,15,0.94); backdrop-filter: blur(20px);
				border: 1px solid var(--border); border-radius: 16px;
			}
			.exp-filter-chip {
				display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px;
				border-radius: 20px; border: 1px solid var(--border); background: transparent;
				color: var(--text-muted); font-size: 12px; cursor: pointer; font-family: inherit;
				transition: all 0.15s;
			}
			.exp-filter-chip.active { border-color: var(--primary); color: var(--primary); background: color-mix(in srgb, var(--primary) 15%, transparent); }

			/* Portada */
			.exp-cover { position: relative; width: 100%; height: 420px; overflow: hidden; background: var(--surface); }
			/* Portada compacta (sin imagen de fondo): sin hueco grande */
			.exp-cover.exp-cover-compact { height: auto; background: transparent; }
			.exp-cover.exp-cover-compact .exp-cover-overlay { display: none; }
			.exp-cover.exp-cover-compact .exp-cover-content { position: static; padding: 76px 22px 18px; }
			.exp-cover.exp-cover-compact .exp-cover-title { text-shadow: none; }
			.exp-cover-img { width: 100%; height: 100%; object-fit: cover; }
			.exp-cover-placeholder { width: 100%; height: 100%; background: linear-gradient(135deg, var(--surface), var(--card)); }
			.exp-cover-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.82) 100%); }
			.exp-cover-content { position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 22px 26px; }
			.exp-cover-logo {
				width: 54px; height: 54px; border-radius: 14px; overflow: hidden;
				background: var(--card); border: 1.5px solid rgba(255,255,255,0.15);
				margin-bottom: 14px; display: flex; align-items: center; justify-content: center;
			}
			.exp-cover-logo img { width: 100%; height: 100%; object-fit: cover; }
			.exp-cover-title {
				font-family: var(--font-titulo, inherit); font-size: 34px; font-weight: 700;
				line-height: 1.05; color: #fff; letter-spacing: -0.3px;
				text-shadow: 0 2px 20px rgba(0,0,0,0.5);
			}
			.exp-cover-subtitle { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 6px; }

			/* Contenido */
			.exp-content { padding: 22px 16px calc(90px + env(safe-area-inset-bottom)); }
			.exp-section { margin-bottom: 34px; }

			/* Cabecera de categoría (banner) */
			.exp-cat-header { position: relative; width: 100%; height: 150px; border-radius: var(--radius); overflow: hidden; margin-bottom: 18px; background: linear-gradient(135deg, var(--card), var(--surface)); }
			/* Cabecera compacta (categoría sin imagen): solo título + línea */
			.exp-cat-header-compact { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
			.exp-cat-header-compact span {
				font-family: var(--font-titulo, inherit); font-size: 22px; font-weight: 700;
				text-transform: uppercase; letter-spacing: 1px; color: var(--primary); white-space: nowrap;
			}
			.exp-cat-header-compact::after { content: ''; flex: 1; height: 2px; background: linear-gradient(90deg, var(--primary) 0%, transparent 100%); opacity: 0.5; }
			.exp-cat-header-img { width: 100%; height: 100%; object-fit: cover; }
			.exp-cat-header-ph { width: 100%; height: 100%; background: linear-gradient(135deg, var(--card), var(--surface)); }
			.exp-cat-header-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.35); }
			.exp-cat-header-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
			.exp-cat-header-label span {
				font-family: var(--font-titulo, inherit); font-size: 19px; font-weight: 700;
				letter-spacing: 2px; text-transform: uppercase; color: #fff;
				border-top: 1px solid rgba(255,255,255,0.35); border-bottom: 1px solid rgba(255,255,255,0.35);
				padding: 6px 18px; text-shadow: 0 2px 12px rgba(0,0,0,0.5);
			}

			/* Vista LISTA */
			.exp-list { display: flex; flex-direction: column; }
			.exp-item {
				display: flex; gap: 12px; padding: 14px 0; cursor: pointer;
				border-bottom: 1px solid var(--border); transition: opacity 0.15s;
			}
			.exp-item:last-child { border-bottom: none; }
			.exp-item:active { opacity: 0.7; }
			.exp-thumb { width: 74px; height: 92px; border-radius: 12px; overflow: hidden; flex-shrink: 0; background: var(--card); }
			.exp-thumb img { width: 100%; height: 100%; object-fit: cover; }
			.exp-thumb-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 30px; background: var(--card); }
			.exp-item-info { flex: 1; min-width: 0; }
			.exp-item-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
			.exp-item-name { font-family: var(--font-titulo, inherit); font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.3; }
			.exp-item-price { font-family: var(--font-titulo, inherit); font-size: 15px; font-weight: 700; color: var(--primary); white-space: nowrap; }
			.exp-item-desc {
				font-size: 12.5px; color: var(--text-muted); line-height: 1.5; margin-top: 3px;
				display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
			}
			.exp-item-filters { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
			.exp-fchip {
				display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px;
				padding: 3px 8px; border-radius: 20px; background: var(--card); color: var(--text-muted);
			}

			/* Badges */
			.exp-badges { display: flex; flex-wrap: wrap; gap: 5px; margin: 5px 0 2px; }
			.exp-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 500; padding: 3px 8px; border-radius: 20px; }
			.exp-badge-popular { background: rgba(234,179,8,0.14); color: #eab308; }
			.exp-badge-chef { background: color-mix(in srgb, var(--primary) 14%, transparent); color: var(--primary); }
			.exp-badge-nuevo { background: rgba(129,140,248,0.14); color: #818cf8; }

			/* Vista CUADRÍCULA */
			.exp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
			.exp-card { background: var(--card); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); cursor: pointer; transition: transform 0.18s; }
			.exp-card:active { transform: scale(0.97); }
			.exp-card-imgwrap { position: relative; width: 100%; aspect-ratio: 4/3; background: var(--surface); }
			.exp-card-img { width: 100%; height: 100%; object-fit: cover; display: block; }
			.exp-card-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 34px; }
			.exp-card-badge { position: absolute; top: 8px; left: 8px; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
			.exp-card-body { padding: 11px 12px 13px; }
			.exp-card-name { font-family: var(--font-titulo, inherit); font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.3; margin-bottom: 3px; }
			.exp-card-desc { font-size: 11px; color: var(--text-muted); line-height: 1.4; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
			.exp-card-price { font-family: var(--font-titulo, inherit); font-size: 14px; font-weight: 700; color: var(--primary); }

			.exp-unavail { opacity: 0.45; }

			/* Estado vacío */
			.exp-empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
			.exp-empty-icon { font-size: 38px; margin-bottom: 12px; }

			/* Nav categorías inferior */
			.exp-catnav-wrap {
				position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
				width: 100%; max-width: 520px; z-index: 50; pointer-events: none;
				padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
			}
			.exp-catnav {
				pointer-events: all; height: 50px; display: flex; align-items: center; gap: 2px;
				padding: 0 6px; overflow-x: auto; scrollbar-width: none;
				background: rgba(10,10,15,0.85); backdrop-filter: blur(20px);
				border: 1px solid var(--border); border-radius: 26px;
			}
			.exp-catnav::-webkit-scrollbar { display: none; }
			.exp-catnav-btn {
				flex-shrink: 0; padding: 7px 16px; border-radius: 20px; border: none;
				background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 500;
				white-space: nowrap; cursor: pointer; transition: all 0.2s; font-family: inherit;
			}
			.exp-catnav-btn.active { background: var(--text); color: var(--dark); }

			/* Footer / guía */
			.exp-footer { margin-top: 10px; }
			.exp-guide { padding-top: 18px; border-top: 1px solid var(--border); margin-bottom: 18px; }
			.exp-guide-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 10px; }
			.exp-guide-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
			.exp-guide-item { font-size: 12px; color: var(--text-muted); }
			.exp-footer-note { text-align: center; font-size: 11px; color: var(--text-dim); padding: 10px 0 4px; }

			/* Modal */
			.exp-modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); z-index: 500; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
			.exp-modal-bg.open { opacity: 1; pointer-events: all; }
			.exp-modal {
				position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%);
				width: 100%; max-width: 520px; background: var(--surface);
				border-radius: 22px 22px 0 0; z-index: 501; max-height: 88vh; overflow-y: auto;
				transition: transform 0.34s cubic-bezier(0.32,0.72,0,1);
			}
			.exp-modal.open { transform: translateX(-50%) translateY(0); }
			.exp-modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; }
			.exp-modal-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; }
			/* El carrusel se reutiliza tal cual del modal compartido, pero allí
			   hereda la altura de un contenedor fijo y aquí no hay ninguno: sin
			   esto se quedaría en cero de alto. Se le da la misma proporción
			   que la imagen simple para que el modal no dé un salto al pasar
			   de un producto con una foto a otro con varias. */
			.exp-modal .modal-carousel { aspect-ratio: 4/3; height: auto; }
			.exp-modal-ph { width: 100%; aspect-ratio: 3/2; display: flex; align-items: center; justify-content: center; font-size: 60px; background: var(--card); }
			.exp-modal-body { padding: 18px 20px 30px; }
			.exp-modal-title { font-family: var(--font-titulo, inherit); font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
			.exp-modal-price { font-family: var(--font-titulo, inherit); font-size: 22px; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
			.exp-modal-desc { font-size: 14px; color: var(--text-muted); line-height: 1.65; }
			.exp-modal-desc-adv { font-size: 13px; color: var(--text-dim); line-height: 1.6; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
			.exp-modal-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }

			/* ══════════════════════════════════════════════════════════
			   TEMA: VIDEO  (carta en video — una columna, 16:9)
			   Se activa cuando atributos.nav = 'video'

			   Reutiliza la nav sticky y los .nav-btn del tema topnav: la
			   diferencia no está en la navegación sino en el cuerpo, así
			   que no hace falta duplicar esos estilos.
			══════════════════════════════════════════════════════════ */

			/* En pantalla ancha la carta no se estira: un video de 16:9 a
			   1400 px de ancho pide una resolución que no vamos a servir y
			   deja la ficha perdida en medio del vacío. Se queda en una
			   columna centrada del ancho de un móvil grande. */
			.vid-lista { max-width: 620px; margin: 0 auto; padding: 8px 12px 40px; }

			.vid-cat {
				font-family: var(--font-titulo, inherit);
				font-size: 13px;
				font-weight: 700;
				letter-spacing: 3px;
				text-transform: uppercase;
				color: var(--primary);
				padding: 26px 4px 12px;
			}

			.vid-plato {
				background: var(--card);
				border: 1px solid var(--border);
				border-radius: var(--radius);
				overflow: hidden;
				margin-bottom: 16px;
			}

			/* El hueco manda: 16:9 fijo pase lo que pase. Reservarlo con
			   aspect-ratio evita además que la página pegue un salto
			   cuando el video termina de cargar. */
			.vid-media {
				position: relative;
				width: 100%;
				aspect-ratio: 16 / 9;
				background: var(--surface);
			}

			/* cover, no contain: si entra un archivo que no es 16:9 se
			   recorta, pero no aparecen franjas negras a los lados. */
			.vid-media > video,
			.vid-media > img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				display: block;
			}

			.vid-media > .no-img-placeholder {
				width: 100%;
				height: 100%;
				display: flex;
				align-items: center;
				justify-content: center;
				opacity: .35;
			}

			.vid-info { padding: 14px 16px 16px; }

			/* El precio no se encoge ni se parte: el nombre ocupa lo que
			   sobra y hace las líneas que necesite. */
			.vid-fila {
				display: flex;
				align-items: baseline;
				justify-content: space-between;
				gap: 14px;
			}

			.vid-nombre {
				font-family: var(--font-titulo, inherit);
				font-size: 17px;
				font-weight: 700;
				line-height: 1.3;
				color: var(--text);
			}

			.vid-precio {
				font-family: var(--font-titulo, inherit);
				font-size: 17px;
				font-weight: 700;
				color: var(--primary);
				white-space: nowrap;
				flex-shrink: 0;
			}

			/* ── Filtros (segunda fila de la nav) ─────────────────── */
			/* Sin chips dentro el contenedor no existe: nada de una franja
			   vacía bajo las categorías en las cartas que no filtran. */
			.nav-filtros:empty { display: none; }
			.nav-filtros {
				display: flex;
				gap: 8px;
				overflow-x: auto;
				padding: 8px 12px;
				border-top: 1px solid var(--border);
				scrollbar-width: none;
			}
			.nav-filtros::-webkit-scrollbar { display: none; }

			/* Los modelos de menú lateral no tienen barra fija donde meter los
			   chips, así que se les pone una fila propia encima del contenido.
			   No es pegajosa: al no haber nada fijo arriba, quedaría flotando
			   sobre la carta sin nada que la sujete. */
			.nav-filtros-sueltos {
				border-top: none;
				border-bottom: 1px solid var(--border);
				margin-bottom: 4px;
				position: relative;
				z-index: 1;
			}

			.filtro-chip {
				flex-shrink: 0;
				display: inline-flex;
				align-items: center;
				gap: 6px;
				min-height: 34px;
				padding: 6px 14px;
				border: 1px solid var(--border);
				border-radius: 999px;
				background: transparent;
				color: var(--text-muted);
				font-family: var(--font-cuerpo, inherit);
				font-size: 12px;
				cursor: pointer;
				white-space: nowrap;
			}
			.filtro-chip.activo {
				border-color: var(--primary);
				color: var(--primary);
			}

			.vid-desc {
				margin-top: 7px;
				font-size: 13.5px;
				line-height: 1.6;
				color: var(--text-muted);
			}

			/* El botón de agregar va DEBAJO y no encima del video: sobre el
			   video taparía comida, que es lo único que esta carta vende.
			   Alineado a la derecha y compacto, para que se vea sin pesar. */
			.vid-accion { display: flex; justify-content: flex-end; margin-top: 12px; }

			.vid-add {
				display: inline-flex;
				align-items: center;
				gap: 7px;
				min-height: 40px;          /* dedo, no ratón */
				padding: 9px 18px;
				border: 1px solid var(--primary);
				border-radius: 999px;
				background: transparent;
				color: var(--primary);
				font-family: var(--font-cuerpo, inherit);
				font-size: 13px;
				font-weight: 700;
				cursor: pointer;
				transition: background .15s, color .15s;
			}
			.vid-add:active { background: var(--primary); color: var(--dark); }

			/* ── Botón flotante del carrito ───────────────────────── */
			.cart-fab {
				position: fixed;
				right: 18px;
				/* Por encima del borde inferior: en iOS la barra del navegador
				   se come esa franja y el botón queda medio tapado. */
				bottom: calc(18px + env(safe-area-inset-bottom, 0px));
				z-index: 60;
				width: 56px; height: 56px;
				border: none;
				border-radius: 50%;
				background: var(--primary);
				color: var(--dark);
				font-size: 22px;
				cursor: pointer;
				box-shadow: 0 6px 20px rgba(0,0,0,.45);
			}

			.cart-fab-count {
				position: absolute;
				top: -2px; right: -2px;
				min-width: 22px; height: 22px;
				padding: 0 5px;
				border-radius: 11px;
				background: var(--secondary);
				color: #fff;
				font-size: 11px;
				font-weight: 700;
				line-height: 22px;
			}

			/* ══════════════════════════════════════════════════════════
			   TEMA: VERTICAL  (carta en video a pantalla completa, 9:16)
			   Se activa cuando atributos.nav = 'vertical'

			   Hermana de 'video': mismos datos, mismo carrito, mismos
			   filtros y la misma maquinaria de reproducción. Lo que cambia
			   es el encuadre — un plato por pantalla, el texto sobre el
			   video — y por eso lo que cambia son los estilos.
			══════════════════════════════════════════════════════════ */

			/* El cuerpo no se desplaza: lo hace el carrete. Con la página
			   entera desplazándose, la barra de direcciones del móvil se
			   encoge a mitad de gesto, cambia la altura de la ventana y
			   cada plato pega un salto. Con el carrete en su propio
			   contenedor de altura fija eso no puede pasar. */
			body.reels {
				overflow: hidden;
				height: 100dvh;
			}

			.ver-reels {
				height: 100dvh;
				overflow-y: scroll;
				/* Por pasos y obligatorio: se para en un plato o en el
				   siguiente, nunca a medias entre los dos. */
				scroll-snap-type: y mandatory;
				/* Que el rebote del final no arrastre la página de detrás ni
				   dispare el "tirar para recargar" de Android. */
				overscroll-behavior-y: contain;
				scrollbar-width: none;
				margin: 0;
				padding: 0;
				max-width: none;
			}
			.ver-reels::-webkit-scrollbar { display: none; }

			/* Las secciones son solo agrupación: aquí no se ven, y el
			   margen que llevan para el resto de modelos (36 px, para
			   separar categorías en una lista) metería un hueco muerto
			   entre la última foto de una categoría y la primera de la
			   siguiente. Con pasos obligatorios ese hueco es un paso más:
			   se desliza y aparece medio plato con una franja negra. */
			.ver-reels .category-section { margin: 0; }

			.ver-plato {
				position: relative;
				height: 100dvh;
				scroll-snap-align: start;
				scroll-snap-stop: always;   /* no se saltan platos de un manotazo */
				overflow: hidden;
				background: var(--dark);
			}

			.ver-media { position: absolute; inset: 0; }

			/* cover y no contain: el archivo ya viene en 9:16 cuando lo cortó
			   el worker, pero un plato sin video todavía cae a su foto —
			   apaisada— y tiene que llenar la pantalla igual. */
			.ver-media > video,
			.ver-media > img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				display: block;
			}

			.ver-media > .no-img-placeholder {
				width: 100%; height: 100%;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 64px;
				opacity: .25;
			}

			/* El velo es lo que hace legible el texto sobre CUALQUIER
			   fotograma. Sin él, un plato claro deja el nombre invisible y no
			   hay color de marca que lo arregle. Va oscuro arriba y abajo, y
			   transparente en medio, que es donde está la comida. */
			.ver-velo {
				position: absolute;
				inset: 0;
				pointer-events: none;
				background:
					linear-gradient(to bottom,
						rgba(0,0,0,.55) 0%,
						rgba(0,0,0,0) 22%,
						rgba(0,0,0,0) 42%,
						rgba(0,0,0,.75) 82%,
						rgba(0,0,0,.92) 100%);
			}

			.ver-info {
				position: absolute;
				left: 0; right: 0;
				/* Separado del borde inferior: ahí viven la barra del
				   navegador en iOS y el botón flotante del carrito. */
				bottom: calc(22px + env(safe-area-inset-bottom, 0px));
				padding: 0 18px;
				/* El botón de agregar sí se puede pulsar; el resto del
				   bloque deja pasar el dedo al video de detrás. */
				pointer-events: none;
				/* Deja libre la esquina del carrito flotante. */
				padding-right: 88px;
			}
			.ver-info button { pointer-events: auto; }

			.ver-info .ver-cat {
				font-family: var(--font-titulo, inherit);
				font-size: 11px;
				font-weight: 700;
				letter-spacing: 2.5px;
				text-transform: uppercase;
				color: var(--primary);
				margin-bottom: 8px;
				text-shadow: 0 1px 6px rgba(0,0,0,.6);
			}

			.ver-nombre {
				font-family: var(--font-titulo, inherit);
				font-size: 26px;
				font-weight: 700;
				line-height: 1.15;
				color: #fff;
				text-shadow: 0 2px 10px rgba(0,0,0,.7);
			}

			/* Tres líneas y corta. Una descripción larga sobre pantalla
			   completa tapa el plato entero, que es lo único que esta carta
			   vende. */
			.ver-desc {
				margin-top: 8px;
				font-size: 14px;
				line-height: 1.55;
				color: rgba(255,255,255,.86);
				text-shadow: 0 1px 8px rgba(0,0,0,.7);
				display: -webkit-box;
				-webkit-line-clamp: 3;
				line-clamp: 3;
				-webkit-box-orient: vertical;
				overflow: hidden;
			}

			.ver-fila {
				display: flex;
				align-items: center;
				gap: 14px;
				margin-top: 14px;
			}

			.ver-precio {
				font-family: var(--font-titulo, inherit);
				font-size: 22px;
				font-weight: 700;
				color: var(--primary);
				text-shadow: 0 2px 10px rgba(0,0,0,.7);
				white-space: nowrap;
			}

			/* Relleno y no contorno, al revés que en 'video': aquí el fondo
			   es un fotograma cualquiera y un botón transparente se pierde
			   contra la mitad de ellos. */
			.ver-add {
				display: inline-flex;
				align-items: center;
				min-height: 42px;
				padding: 10px 20px;
				border: none;
				border-radius: 999px;
				background: var(--primary);
				color: var(--dark);
				font-family: var(--font-cuerpo, inherit);
				font-size: 13.5px;
				font-weight: 700;
				cursor: pointer;
				box-shadow: 0 4px 16px rgba(0,0,0,.45);
			}
			.ver-add:active { transform: scale(.96); }

			/* ── Navegación flotante ──────────────────────────────── */
			/* Flota en vez de ocupar barra: una carta a pantalla completa que
			   reserva 120 px arriba deja de ser pantalla completa. */
			.ver-chrome {
				position: fixed;
				top: 0; left: 0; right: 0;
				z-index: 50;
				padding: calc(10px + env(safe-area-inset-top, 0px)) 0 6px;
				pointer-events: none;
			}
			.ver-chrome > * { pointer-events: auto; }

			.ver-cats {
				display: flex;
				gap: 8px;
				overflow-x: auto;
				padding: 0 14px 4px;
				scrollbar-width: none;
			}
			.ver-cats::-webkit-scrollbar { display: none; }

			.ver-cat-btn {
				flex-shrink: 0;
				min-height: 34px;
				padding: 6px 15px;
				border: none;
				border-radius: 999px;
				background: rgba(0,0,0,.42);
				-webkit-backdrop-filter: blur(10px);
				backdrop-filter: blur(10px);
				color: rgba(255,255,255,.8);
				font-family: var(--font-cuerpo, inherit);
				font-size: 12.5px;
				font-weight: 600;
				white-space: nowrap;
				cursor: pointer;
			}
			.ver-cat-btn.active {
				background: var(--primary);
				color: var(--dark);
			}

			/* Los chips son los compartidos de core/filtros.js; aquí solo
			   cambia el fondo, porque el suyo se apoya en --border y sobre
			   video no se ve. */
			.ver-filtros {
				border-top: none;
				padding: 4px 14px;
			}
			.ver-filtros .filtro-chip {
				border-color: transparent;
				background: rgba(0,0,0,.42);
				-webkit-backdrop-filter: blur(10px);
				backdrop-filter: blur(10px);
				color: rgba(255,255,255,.78);
			}
			.ver-filtros .filtro-chip.activo {
				background: var(--primary);
				color: var(--dark);
			}

			/* ══════════════════════════════════════════════════════════
			   ESTILOS DEL CARRETE
			   atributos.estilo = 'clasico' | 'intenso' | 'avance'

			   Tres aspectos del MISMO modelo. No hay una línea de lógica que
			   los distinga: todo lo que cambia está aquí abajo. Por eso un
			   estilo nuevo es un bloque de CSS y una opción en el desplegable
			   del panel, y nunca una plantilla más que mantener.

			   Los nombres describen lo que se ve. Las aplicaciones que
			   recuerdan son de otras empresas y no pintan nada dentro de un
			   producto que se cobra.
			══════════════════════════════════════════════════════════ */

			/* ── Barra de avance ──────────────────────────────────── */
			/* Un segmento por plato, como el índice de una secuencia. Solo la
			   enseña el estilo 'avance'; en los otros dos el marcado existe
			   igual pero no se pinta, para que cambiar de estilo no obligue a
			   repintar la carta entera. */
			.ver-segmentos { display: none; }

			body.estilo-avance .ver-segmentos {
				display: flex;
				gap: 3px;
				padding: 0 14px 8px;
			}
			body.estilo-avance .ver-segmentos i {
				flex: 1;
				height: 2.5px;
				border-radius: 2px;
				background: rgba(255,255,255,.28);
				transition: background .25s;
			}
			body.estilo-avance .ver-segmentos i.visto { background: #fff; }

			/* ── INTENSO ──────────────────────────────────────────── */
			/* A sangre y con el texto pegado abajo a la izquierda. El nombre
			   manda sobre todo lo demás y el velo aprieta más, porque este
			   estilo asume que el video es lo único que hay que mirar. */
			body.estilo-intenso .ver-velo {
				background: linear-gradient(to bottom,
					rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 18%,
					rgba(0,0,0,0) 34%, rgba(0,0,0,.85) 78%, rgba(0,0,0,.97) 100%);
			}
			body.estilo-intenso .ver-nombre {
				font-size: 30px;
				letter-spacing: -.5px;
				line-height: 1.05;
			}
			/* Más estrecho de lo que cabría: deja aire para la columna de la
			   derecha y evita que el nombre pase por detrás de los iconos. */
			body.estilo-intenso .ver-info { padding-right: 96px; }
			body.estilo-intenso .ver-desc {
				-webkit-line-clamp: 2;
				line-clamp: 2;
				font-size: 13.5px;
			}
			body.estilo-intenso .ver-cat-btn { border-radius: 8px; }
			body.estilo-intenso .ver-filtros .filtro-chip { border-radius: 8px; }
			body.estilo-intenso .ver-add { border-radius: 10px; }

			/* ── AVANCE ───────────────────────────────────────────── */
			/* Más aire y menos peso. El video va con las esquinas redondeadas
			   en vez de a sangre, el velo apenas se nota y la ficha respira.
			   Sirve para cartas donde el plato es delicado y el video no
			   quiere gritar. */
			body.estilo-avance .ver-media {
				border-radius: 18px;
				overflow: hidden;
			}
			/* El velo tiene que ir por dentro del redondeo, o se le verían las
			   esquinas cuadradas por encima del video. */
			body.estilo-avance .ver-velo { border-radius: 18px; }
			/* Solo con inset, sin padding en .ver-plato: la ficha y el velo
			   también están posicionados contra él, así que un padding los
			   movería a los tres a la vez y el margen saldría doble. */
			body.estilo-avance .ver-media,
			body.estilo-avance .ver-velo { inset: 6px 8px; }

			body.estilo-avance .ver-velo {
				background: linear-gradient(to bottom,
					rgba(0,0,0,.4) 0%, rgba(0,0,0,0) 26%,
					rgba(0,0,0,0) 50%, rgba(0,0,0,.62) 84%, rgba(0,0,0,.8) 100%);
			}
			body.estilo-avance .ver-info {
				bottom: calc(32px + env(safe-area-inset-bottom, 0px));
				padding-left: 26px;
			}
			body.estilo-avance .ver-nombre { font-size: 23px; font-weight: 600; }
			body.estilo-avance .ver-cat { letter-spacing: 3.5px; }
			body.estilo-avance .ver-fila { margin-top: 18px; }
			/* El :not() no es adorno. Sin él esta regla gana por especificidad a
			   la del estado activo —lleva una clase más que .ver-cat-btn.active—
			   y se lleva por delante el resaltado: dejaba de verse en qué
			   categoría estás y qué filtros tienes puestos. Un estilo no puede
			   apagar una señal de estado. */
			body.estilo-avance .ver-cat-btn:not(.active),
			body.estilo-avance .ver-filtros .filtro-chip:not(.activo) { background: rgba(0,0,0,.3); }

			/* ── Pista de deslizar ────────────────────────────────── */
			/* Una pantalla completa no enseña que hay más debajo: no asoma el
			   borde del siguiente plato, que es lo que en una lista normal
			   invita a seguir bajando. */
			.ver-pista {
				position: fixed;
				left: 50%;
				bottom: calc(96px + env(safe-area-inset-bottom, 0px));
				transform: translateX(-50%);
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 2px;
				color: rgba(255,255,255,.75);
				font-size: 11px;
				letter-spacing: 1.5px;
				text-transform: uppercase;
				text-shadow: 0 1px 8px rgba(0,0,0,.8);
				pointer-events: none;
				transition: opacity .35s;
			}
			.ver-pista::after {
				content: '⌃';
				font-size: 17px;
				line-height: 1;
				animation: verSube 1.6s ease-in-out infinite;
			}
			.ver-pista.ida { opacity: 0; }

			@keyframes verSube {
				0%, 100% { transform: translateY(0);    opacity: .55; }
				50%      { transform: translateY(-5px); opacity: 1; }
			}

			@media (prefers-reduced-motion: reduce) {
				.ver-pista::after { animation: none; }
			}

			/* ── Barra social ─────────────────────────────────────── */
			/* En los demás modelos va centrada abajo, flotando sobre el final
			   de la carta, y ahí no estorba porque debajo solo hay pie.
			   Aquí abajo está la ficha del plato —nombre, precio y el botón de
			   agregar— así que la barra le caía encima y la tapaba: tiene más
			   z-index. Se ve raro y además esconde el precio.

			   Se pasa al lateral derecho, en columna, que es donde la busca
			   quien esté acostumbrado a las aplicaciones que este modelo imita.
			   Sin fondo de píldora ni etiquetas: sobre video a pantalla completa
			   una caja opaca pesa mucho, y el icono solo se entiende igual. */
			body.reels .social-bar {
				left: auto;
				right: 12px;
				transform: none;
				/* Por encima del carrito flotante, que ocupa la esquina. */
				bottom: calc(88px + env(safe-area-inset-bottom, 0px));
				flex-direction: column;
				gap: 10px;
				z-index: 55;
				background: none;
				-webkit-backdrop-filter: none;
				backdrop-filter: none;
				border: none;
				padding: 0;
			}

			body.reels .social-btn {
				padding: 0;
				width: 42px; height: 42px;
				border-radius: 50%;
				justify-content: center;
				background: rgba(0,0,0,.42);
				-webkit-backdrop-filter: blur(10px);
				backdrop-filter: blur(10px);
				color: #fff;
			}
			body.reels .social-btn span { display: none; }
			body.reels .social-btn svg { width: 21px; height: 21px; }
			body.reels .social-btn:active { background: var(--primary); color: var(--dark); }

			/* La regla compartida sube el botón de subir cuando hay barra
			   social, pero en este modelo ese botón no existe. */
			body.reels .scroll-top { display: none; }

			.ver-vacio {
				height: 100dvh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 40px;
				text-align: center;
				color: var(--text-muted);
			}

			/* En pantalla de escritorio un 9:16 estirado a 1400 px es una
			   franja de video ampliada hasta el borrón. Se queda del ancho de
			   un móvil, centrado, con el resto en negro. */
			/* En pantalla ancha un 9:16 estirado a 1400 px es una franja de
			   video ampliada hasta el borrón. Se queda en una columna
			   centrada, con el resto en negro.

			   El ancho sale de la altura y no de un número redondo: así la
			   columna es exactamente 9:16 y el video se ve entero, sin
			   recortar por los lados. El tope de 520 px es para que en un
			   monitor muy alto no crezca hasta parecer otra cosa. */
			/* La altura mínima deja fuera el móvil tumbado: ahí sobra ancho
			   pero falta alto, y una columna sacada de esa altura saldría de
			   220 px — una rendija. Tumbado se queda a pantalla completa. */
			@media (min-width: 700px) and (min-height: 600px) {
				:root { --ver-ancho: min(calc(100dvh * 9 / 16), 520px); }

				.ver-plato { max-width: var(--ver-ancho); margin: 0 auto; }
				/* Ancho y no max-width: con 'right: auto' el elemento deja de
				   estirarse y se encoge a lo que midan sus chips, así que la
				   barra quedaba más estrecha que el video y descentrada. */
				.ver-chrome { width: var(--ver-ancho); left: 50%; right: auto; transform: translateX(-50%); }
				.ver-reels { background: #000; }

				/* El carrito flotante y la barra social se cuelgan del borde de
				   la columna, no del de la ventana: a 1440 px se quedaban a
				   media pantalla de la carta, sin relación visible con ella. */
				body.reels .cart-fab   { right: calc(50% - var(--ver-ancho) / 2 + 18px); }
				body.reels .social-bar { right: calc(50% - var(--ver-ancho) / 2 + 12px); }
			}
		</style>
	</head>
	<body>

		<!--
			════════════════════════════════════════════════════════
			TEMA: TOPNAV (header hero + nav horizontal)
			loader.js inyecta la clase 'tema-topnav' en <body> y oculta los bloques que no aplican.
			════════════════════════════════════════════════════════
		-->

		<!-- Header hero (topnav) -->
		<div class="header-hero" id="headerHero" style="display:none">
			<img id="heroLogo" alt="" class="hero-logo" style="display:none">
			<div class="hero-title" id="heroTitle"></div>
			<div class="hero-sub" id="heroSub"></div>
		</div>

		<!-- Nav horizontal sticky (topnav) -->
		<nav class="nav-sticky" id="navSticky" style="display:none">
			<div class="nav-scroll" id="navScroll"></div>
			<!-- Segunda fila, debajo de las categorías. La rellena el tema que
			     tenga filtros encendidos; vacía no ocupa nada. -->
			<div class="nav-filtros" id="navFiltros"></div>
		</nav>

		<!--
			════════════════════════════════════════════════════════
			TEMA: SIDEBAR (header fijo + menú lateral hamburguesa)
			════════════════════════════════════════════════════════
		-->

		<!-- Header fijo (sidebar y carrito) -->
		<div class="header-fixed" id="headerFixed" style="display:none">
			<button class="menu-toggle" id="menuToggle">
				<span></span><span></span><span></span>
			</button>
			<div class="logo-header" id="logoHeader"></div>
			<div style="width:40px;display:flex;align-items:center;justify-content:center;">
				<button class="cart-btn" id="cartBtn" style="display:none" onclick="window.vmToggleCart()">
					🛒<span class="cart-count" id="cartCount">0</span>
				</button>
			</div>
		</div>

		<!-- Sidebar -->
		<div class="sidebar" id="sidebar" style="display:none">
			<div class="sidebar-header">
				<div class="sidebar-title">Menú</div>
				<button class="close-menu" id="closeMenu">✕</button>
			</div>
			<nav class="sidebar-nav" id="sidebarNav"></nav>
		</div>

		<div class="overlay" id="overlay"></div>

		<!--
			════════════════════════════════════════════════════════
			TEMA: CARRITO — carrito lateral, checkout y personalización.
			Siempre en el DOM (igual que modal/lightbox/promo); solo se
			abren si el tema activo es 'carrito'.
			════════════════════════════════════════════════════════
		-->

		<!-- Botón flotante del carrito. El modelo 'carrito' lleva el suyo en la
		     cabecera fija; los que no tienen cabecera fija —el de video— usan
		     este. Lo enseña el tema que encienda el carrito, no la maquinaria. -->
		<button class="cart-fab" id="cartFab" style="display:none" onclick="window.vmToggleCart()" aria-label="Ver el pedido">
			🛒<span class="cart-fab-count" id="cartFabCount">0</span>
		</button>

		<!-- Carrito lateral -->
		<div class="cart-sidebar" id="cartSidebar">
			<div class="cart-header">
				<h3>🛒 Tu Pedido</h3>
				<button class="close-cart" onclick="window.vmToggleCart()">✕</button>
			</div>
			<div class="cart-items" id="cartItems"></div>
			<div class="cart-empty" id="cartEmpty">
				<div style="font-size:38px;">🛒</div>
				<p>Tu carrito está vacío</p>
				<span style="font-size:11px;">¡Agrega algo delicioso!</span>
			</div>
			<div class="cart-footer">
				<div class="cart-total"><span>Total:</span><strong id="cartTotal">$0</strong></div>
				<button class="btn-checkout" id="checkoutBtn" onclick="window.vmOpenCheckout()" style="display:none">Hacer Pedido</button>
			</div>
		</div>

		<!-- Checkout -->
		<div class="checkout-overlay" id="checkoutOverlay">
			<div class="checkout-modal">
				<div class="checkout-header">
					<h3>Finalizar Pedido</h3>
					<button class="close-checkout" onclick="window.vmCloseCheckout()">✕</button>
				</div>
				<form onsubmit="window.vmSendWhatsAppOrder(event)">
					<div class="checkout-form-group">
						<label>👤 Tu Nombre</label>
						<input type="text" id="clientName" placeholder="Ej: Juan Pérez" required>
					</div>
					<div class="checkout-form-group">
						<label>📍 Dirección de Entrega</label>
						<textarea id="clientAddress" rows="3" placeholder="Ej: Calle 10 # 20-30" required></textarea>
					</div>
					<div class="checkout-form-group">
						<label>💳 Método de Pago</label>
						<select id="paymentMethod" required onchange="window.vmUpdatePaymentDetails()"></select>
						<div id="paymentDetails" class="checkout-summary" style="display:none;margin-top:10px;"></div>
					</div>
					<div class="checkout-summary" id="checkoutSummary"></div>
					<button type="submit" class="btn-send-order">📱 Enviar Pedido por WhatsApp</button>
				</form>
			</div>
		</div>

		<!-- Personalización (toppings) -->
		<div class="custom-overlay" id="customOverlay">
			<div class="custom-modal">
				<div class="custom-head">
					<div>
						<div class="custom-name" id="customName"></div>
						<div class="custom-base-price" id="customBasePrice"></div>
					</div>
					<button class="custom-close" onclick="window.vmCloseCustomModal()">✕</button>
				</div>
				<div class="custom-total-row">
					<span>Total:</span>
					<span class="custom-total-value" id="customTotal">$0</span>
				</div>
				<div class="custom-section" id="secToppingsPlatino">
					<div class="custom-section-title">⭐ TOPPINGS PLATINO</div>
					<div class="custom-section-hint">Elige los que quieras — sin costo adicional</div>
					<div class="custom-chip-list" id="listToppingsPlatino"></div>
				</div>
				<div class="custom-section" id="secToppingsPremium">
					<div class="custom-section-title">🔥 TOPPINGS PREMIUM</div>
					<div class="custom-section-hint">Cada uno con costo adicional</div>
					<div class="custom-chip-list" id="listToppingsPremium"></div>
				</div>
				<div class="custom-section" id="secSalsas">
					<div class="custom-section-title">🥫 SALSAS</div>
					<div class="custom-section-hint">Elige las que quieras — sin costo adicional</div>
					<div class="custom-chip-list" id="listSalsas"></div>
				</div>
				<div class="custom-qty-row">
					<button class="custom-qty-btn" id="btnMenos">−</button>
					<span class="custom-qty-value" id="customQty">1</span>
					<button class="custom-qty-btn" id="btnMas">+</button>
				</div>
				<button class="btn-send-order" id="btnAgregarCarrito">🛒 AGREGAR AL CARRITO</button>
			</div>
		</div>

		<!--
			════════════════════════════════════════════════════════
			CONTENIDO COMPARTIDO (ambos temas)
			════════════════════════════════════════════════════════
		-->

		<main id="mainContent"></main>

		<div class="footer" id="footer">© VMenus · Menú Digital</div>

		<button class="scroll-top" id="scrollTop">↑</button>

		<!-- Modal producto -->
		<div class="modal-overlay" id="modalOverlay" onclick="window.vmHandleOverlay(event)">
			<div class="modal-sheet" id="modalSheet">
				<div class="modal-img-wrap" id="modalImgWrap">
					<button class="modal-close-btn" onclick="window.vmCloseModal()">✕</button>
					<button class="modal-nav modal-nav-prev" id="modalPrev" onclick="window.vmNavigate(-1)">‹</button>
					<button class="modal-nav modal-nav-next" id="modalNext" onclick="window.vmNavigate(1)">›</button>
				</div>
				<div class="modal-body">
					<div class="modal-name" id="modalName"></div>
					<div class="modal-desc-avanzada" id="modalDescAvanzada" style="display:none"></div>
					<div class="modal-price" id="modalPrice"></div>
					<div class="modal-desc" id="modalDesc"></div>
					<div class="modal-counter" id="modalCounter"></div>
				</div>
			</div>
		</div>

		<!-- Lightbox -->
		<div class="lightbox" id="lightbox" onclick="window.vmCloseLightbox()">
			<button class="lightbox-close">✕</button>
			<img id="lightboxImg" src="" alt="">
		</div>

		<!-- Promo modal -->
		<div class="promo-overlay" id="promoOverlay">
			<div class="promo-box">
				<img class="promo-img" alt="Promoción" onerror="window.vmClosePromo()">
				<button class="promo-close" onclick="window.vmClosePromo()">✕</button>
			</div>
		</div>

		<script type="module">
			import {
				closeModal, closeLightbox, closePromo,
				navigateModal, handleOverlayClick, noImgHtml
			} from './core/menu.js';
			import { sbFetch } from './core/supabase.js';

			// Exponer funciones al HTML (onclick inline)
			window.vmCloseModal = closeModal;
			window.vmCloseLightbox = closeLightbox;
			window.vmClosePromo = closePromo;
			window.vmNavigate = navigateModal;
			window.vmHandleOverlay = handleOverlayClick;
			window.vmNoImg = noImgHtml;

			// ── ACTIVAR TEMA (mostrar/ocultar bloques HTML) ──────────
			// Se llama desde loader.js antes de buildNav()
			// Rellena el bloque hero (logo + título + frase), compartido entre
			// el tema topnav (siempre) y sidebar/carrito (opcional, cuando el
			// restaurante activa "mostrar mensaje de bienvenida").
			function fillHero(restaurante) {
				const logo = document.getElementById('heroLogo');
				if (restaurante.logo_url) {
				  logo.onload = () => { logo.style.display = 'block'; logo.style.margin = '0 auto 10px'; };
				  logo.onerror = () => { logo.style.display = 'none';  };
				  logo.src = restaurante.logo_url;
				  logo.alt = restaurante.nombre;
				}
				else {
					logo.style.display = 'none';
				}
				document.getElementById('heroTitle').textContent = restaurante.nombre.toUpperCase();
				document.getElementById('heroSub').textContent = restaurante.atributos?.subtitulo || 'Carta Digital · ' + new Date().getFullYear();
			}

			window.activarTema = function(tema, restaurante) {
				if (tema === 'explorar') {
					// El tema explorar construye todo su propio DOM en explorar.js.
					// Ocultamos el footer compartido y el botón scroll-top para que
					// no dupliquen/estorben con los que trae el propio tema.
					const f = document.querySelector('.footer'); if (f) f.style.display = 'none';
					const st = document.getElementById('scrollTop'); if (st) st.style.display = 'none';
					return;
				}
				if (tema === 'vertical') {
					// El carrete ocupa la pantalla entera y trae su propia
					// navegación flotando encima. Todo lo compartido que
					// ocupe sitio estorba: el pie quedaría inalcanzable al
					// final de un contenedor que no desplaza la página, y el
					// botón de subir taparía el de agregar.
					const f = document.querySelector('.footer'); if (f) f.style.display = 'none';
					const st = document.getElementById('scrollTop'); if (st) st.style.display = 'none';
					// Quien desplaza es el carrete, no el cuerpo. Sin esto se
					// desplazan los dos y el móvil da tirones.
					document.body.classList.add('reels');
					return;
				}
				if (tema === 'sidebar' || tema === 'carrito') {
					document.getElementById('headerFixed').style.display = 'flex';
					document.getElementById('sidebar').style.display = 'block';
					document.getElementById('mainContent').classList.add('with-fixed-header');
					// Rellenar nombre en header fijo
					document.getElementById('logoHeader').textContent = restaurante.nombre.toUpperCase();
					document.querySelector('.footer').textContent = `© ${new Date().getFullYear()} ${restaurante.nombre.toUpperCase()} · Todos los derechos reservados`;
					if (tema === 'carrito') {
						document.getElementById('cartBtn').style.display = 'flex';
					}
					// Mensaje de bienvenida opcional debajo del header fijo
					// (logo + nombre + frase) — solo si el restaurante lo activa.
					if (restaurante.atributos?.mostrar_hero) {
						const hero = document.getElementById('headerHero');
						hero.classList.add('under-fixed-header');
						hero.style.display = 'block';
						fillHero(restaurante);
					}
				} else {
					// topnav (default)
					document.getElementById('headerHero').style.display = 'block';
					document.getElementById('navSticky').style.display = 'block';
					fillHero(restaurante);
					document.querySelector('.footer').textContent = `© ${new Date().getFullYear()} ${restaurante.nombre.toUpperCase()} · Todos los derechos reservados`;
				}
			};

			// Arrancar
			import('./core/loader.js');
		</script>
	</body>
</html>
